# 게임 안 '의견 보내기'로 들어온 이슈에 제목 앞의 [종류]를 보고 라벨을 붙입니다.
name: Label feedback
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const m = context.payload.issue.title.match(/^\[(버그|건의|밸런스|기타)\]/);
            if (!m) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.issue.number, labels: [m[1]],
            });
