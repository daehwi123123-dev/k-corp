// 클라우드(계정에 저장, 기기 간 이어하기)를 쓸 수 있으면 쓰고, 아니면 이 기기의 브라우저에 저장한다.
const SLOTS=[{k:'auto',n:L`자동 저장`},{k:'slot1',n:L`슬롯 1`},{k:'slot2',n:L`슬롯 2`},{k:'slot3',n:L`슬롯 3`}];
const CLOUD={db:null,uid:null,ready:false,writing:false,dirty:false,offered:false};
async function initCloud(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    CLOUD.db=db;CLOUD.uid=uid;CLOUD.ready=true;
    if(s&&!document.getElementById('title'))render();
    offerCloudContinue();
  }catch(e){}
}
const slotRef=k=>CLOUD.db.collection('data/users/'+CLOUD.uid).doc(k);
function slotBody(){
  const st=JSON.parse(JSON.stringify(s));st.log=st.log.slice(0,60);
  return {name:s.name,industry:s.industry,date:L`${s.year}년 ${s.month}월`,valuation:s.valuation,stage:STAGES[stageIdx()].n,over:!!s.over,savedAt:Date.now(),state:JSON.stringify(st)};
}
async function writeSlot(k){
  const body=slotBody();
  if(CLOUD.ready){await slotRef(k).set(body);return}
  localStorage.setItem('kcorp-slot-'+k,JSON.stringify(body));
}
async function readSlot(k){
  if(CLOUD.ready){const d=await slotRef(k).get();return d.exists?d.data():null}
  try{const t=localStorage.getItem('kcorp-slot-'+k);return t?JSON.parse(t):null}catch(e){return null}
}
async function removeSlot(k){
  if(CLOUD.ready){await slotRef(k).delete();return}
  try{localStorage.removeItem('kcorp-slot-'+k)}catch(e){}
}
// 매달 결산 후 자동 저장 (클라우드는 한 번에 하나씩만 쓴다)
async function cloudAuto(){
  if(!s)return;
  if(!CLOUD.ready){try{localStorage.setItem('kcorp-slot-auto',JSON.stringify(slotBody()))}catch(e){}return}
  if(CLOUD.writing){CLOUD.dirty=true;return}
  CLOUD.writing=true;
  try{await writeSlot('auto')}catch(e){}
  CLOUD.writing=false;
  if(CLOUD.dirty){CLOUD.dirty=false;cloudAuto()}
}
function applyLoaded(body){
  const st=migrate(JSON.parse(body.state));

// 다른 기기에서 더 진행한 게임이 있으면 이어하기를 제안
async function offerCloudContinue(){
  if(CLOUD.offered)return;CLOUD.offered=true;
  let auto;try{auto=await readSlot('auto')}catch(e){return}
  if(!auto||auto.over)return;
  const localAt=s?.savedAt||0;
  if(s&&auto.savedAt<=localAt+30000)return;
  modal(L`☁️ 이어서 하기`,L`<p>계정에 저장된 게임이 있어요.</p><div class="kv"><span class="muted">회사</span><b>${esc(auto.name)}</b><span class="muted">진행</span><b>${esc(auto.date)} · ${esc(auto.stage)}</b><span class="muted">기업가치</span><b>${won(auto.valuation)}</b><span class="muted">저장 시각</span><b>${new Date(auto.savedAt).toLocaleString('ko-KR')}</b></div>${s?L`<p class="muted" style="font-size:12px">지금 이 기기에서 하던 게임보다 최근에 저장됐어요.</p>`:''}`,

}
function relTime(t){const m=Math.round((Date.now()-t)/60000);return m<1?L`방금`:m<60?L`${m}분 전`:m<1440?L`${Math.round(m/60)}시간 전`:new Date(t).toLocaleDateString('ko-KR')}
async function saveMenu(){
  const m=modal(L`💾 저장 / 불러오기`,L`<p class="muted" style="margin-top:0;font-size:13px">${CLOUD.ready?L`☁️ <b>클라우드 저장</b> 사용 중이에요. 휴대폰·PC 어디서 열어도 이어서 할 수 있어요.`:L`💻 이 기기의 브라우저에만 저장돼요. 다른 기기에서는 보이지 않아요.`}</p><div class="slots"><p class="muted">불러오는 중…</p></div>`,[{l:L`닫기`,f:()=>{}}]);
  const box=m.querySelector('.slots');
  let rows;
  try{rows=await Promise.all(SLOTS.map(async sl=>({...sl,d:await readSlot(sl.k)})))}
  catch(e){box.innerHTML=L`<p class="neg">저장 목록을 불러오지 못했어요. 잠시 후 다시 열어 주세요.</p>`;return}
  if(!document.body.contains(box))return;
  box.innerHTML=rows.map(r=>`<div class="slot" data-k="${r.k}">
    <div class="slot-info"><b>${r.n}</b>${r.d?L`<span>${esc(r.d.name)} · ${esc(r.d.date)} · ${won(r.d.valuation)}</span><span class="muted">${relTime(r.d.savedAt)} 저장${r.d.over?L` · 종료된 게임`:''}</span>`:L`<span class="muted">비어 있음</span>`}</div>
    <div class="slot-btns">${r.k!=='auto'?L`<button class="btn" data-act="save">저장</button>`:''}${r.d?L`<button class="btn" data-act="load">불러오기</button><button class="btn" data-act="del" aria-label="삭제">🗑</button>`:''}</div></div>`).join('');
  box.querySelectorAll('.slot button').forEach(b=>b.onclick=async()=>{
    const k=b.closest('.slot').dataset.k,row=rows.find(r=>r.k===k),act=b.dataset.act;
    const needConfirm=(act==='save'&&row.d)||act==='del'||(act==='load'&&s&&!s.over);
    if(needConfirm&&!b.dataset.armed){b.dataset.armed=1;b.textContent=act==='save'?L`덮어쓸까요?`:act==='del'?L`삭제할까요?`:L`지금 게임 대신?`;b.classList.add('warnbtn');return}
    b.disabled=true;b.textContent='…';
    try{
      if(act==='save'){await writeSlot(k);toast(L`<b>💾 ${row.n}에 저장했어요</b>`,'good');saveMenu()}
      else if(act==='load'){applyLoaded(row.d)}
      else{await removeSlot(k);saveMenu()}
    }catch(e){b.textContent=L`실패`;toast(e&&e.code==='quota_exceeded'?L`저장 공간이 가득 찼어요. 다른 슬롯을 지워 주세요.`:L`저장하지 못했어요. 잠시 후 다시 시도해 주세요.`,'bad')}
  });
}

function makeChar(i){

function drawChart(anim){
  const cv=document.getElementById('chart');if(!cv)return;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const d=s.history.map(v=>Math.log10(Math.max(1,v)));
  if(d.length<2){g.fillStyle=cs.getPropertyValue('--muted');g.font='12px sans-serif';g.fillText(L`몇 달 지나면 그래프가 그려집니다`,4,h/2);return}
  const mn=Math.min(...d),mx=Math.max(...d,mn+.5);
  const X=i=>4+i/(d.length-1)*(w-8),Y=v=>h-6-(v-mn)/(mx-mn)*(h-12);
  const accent=cs.getPropertyValue('--accent').trim();
  const frame=p=>{
    g.clearRect(0,0,w,h);
    const last=d.length-1,endI=last-1+p;
    const ex=X(last-1)+(X(last)-X(last-1))*p,ey=Y(d[last-1])+(Y(d[last])-Y(d[last-1]))*p;
    // 영역 채우기
    const grad=g.createLinearGradient(0,0,0,h);grad.addColorStop(0,accent+'55');grad.addColorStop(1,accent+'00');
    g.beginPath();g.moveTo(X(0),h);d.forEach((v,i)=>{if(i<=last-1)g.lineTo(X(i),Y(v))});g.lineTo(ex,ey);g.lineTo(ex,h);g.closePath();g.fillStyle=grad;g.fill();
    g.strokeStyle=accent;g.lineWidth=2;g.lineJoin='round';g.beginPath();
    d.forEach((v,i)=>{if(i<=last-1)i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v))});g.lineTo(ex,ey);g.stroke();
    g.fillStyle=accent;g.beginPath();g.arc(ex,ey,3.5,0,Math.PI*2);g.fill();
  };
  if(!anim||RM)return frame(1);
  const t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/700);frame(1-Math.pow(1-p,3));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step);
}

const SPEEDS=[{n:'1x',ms:3000},{n:'2x',ms:1500},{n:'4x',ms:700}];
const clock={run:false,spd:0,acc:0,last:0};
try{clock.spd=Math.min(2,+localStorage.getItem('kcorp-spd')||0)}catch(e){}
const blocked=()=>!s||(s.over&&!s.won)||busy||!!document.getElementById('modal-root').firstChild||!!document.getElementById('title')||document.hidden;
function weekTick(){
  if(!s||(s.over&&!s.won))return;
  const free=()=>!document.getElementById('modal-root').firstChild&&!(s.over&&!s.won);
  if((s.week||1)>=4){nextMonth('clock');toast(L`<b>📊 ${s.month===1?12:s.month-1}월 결산</b><br>순이익 ${won(s.profit)}`,s.profit>=0?'good':'bad');if(free())rollEvent(.125);return}
  const w=calcMonth(rf(.9,1.1));const wp=Math.round((w.pre-w.tax)/4);
  s.week=(s.week||1)+1;s.cash+=wp;s.weekCash=(s.weekCash||0)+wp;
  calcValuation();checkEndings();save();render();
  if(free())rollEvent(.125);
}
function clockFrame(){
  const now=performance.now(),dt=Math.min(250,now-(clock.last||now));clock.last=now;
  if(clock.run&&!blocked()){clock.acc+=dt;if(clock.acc>=SPEEDS[clock.spd].ms){clock.acc=0;weekTick()}}
  const f=document.querySelector('.wk-fill');
  if(f&&s)f.style.width=(((s.week||1)-1)+clock.acc/SPEEDS[clock.spd].ms)/4*100+'%';
}

function setRun(v){clock.run=v;clock.last=performance.now();if(s)renderBar()}
function renderBar(){

    <button class="btn primary nb-play ${clock.run?'':'paused'}" id="next" ${s.over&&!s.won?'disabled':''}><span class="wk-fill"></span><span>${clock.run?L`⏸ 일시정지`:L`▶ 진행`}</span><span class="ap">${dots}</span></button>
    <button class="btn nb-sm" id="spd" title="속도">${SPEEDS[clock.spd].n}</button>
    <button class="btn nb-sm" id="skip" title="다음 주로">⏭</button></div>
    <nav class="tabs">${[['co','🏢',L`회사`],['st','📊',L`현황`],['rv','⚔️',L`경쟁`],['pd','📦',L`제품`],['lg','📜',L`일지`]].map(([k,i,n])=>`<button data-t="${k}" class="${tab===k?'on':''}">${k==='co'&&tab!=='co'&&s.raid&&s.raid.pct>myVotes()*.8||k==='lg'&&tab!=='lg'&&logSeq>lastLogSeen&&lastLogSeen>=0?'<span class="dot"></span>':''}<b>${i}</b>${n}</button>`).join('')}</nav>`;
  nb.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

  nb.querySelector('#skip').onclick=()=>{if(!blocked()){clock.acc=0;weekTick()}};
  clockFrame();

// 배경음악: 파일 없이 Web Audio로 직접 연주하는 잔잔한 루프. 적자일 땐 단조로 바뀐다.
const BGM={ctx:null,master:null,timer:0,next:0,step:0,bar:0,noise:null};
const midi=n=>440*Math.pow(2,(n-69)/12);
const PROG={
  up:[{b:36,c:[52,55,59,64]},{b:33,c:[52,55,57,60]},{b:29,c:[52,57,60,64]},{b:31,c:[50,55,59,62]}],
  down:[{b:33,c:[52,57,60,64]},{b:29,c:[53,57,60,65]},{b:26,c:[53,57,62,65]},{b:28,c:[52,56,59,64]}],
};
function bgmInit(){
  if(BGM.ctx)return true;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  try{BGM.ctx=new AC()}catch(e){return false}
  const c=BGM.ctx,comp=c.createDynamicsCompressor(),lp=c.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=5200;
  BGM.master=c.createGain();BGM.master.gain.value=0;
  BGM.master.connect(lp);lp.connect(comp);comp.connect(c.destination);
  const len=c.sampleRate*.2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;BGM.noise=buf;
  return true;
}
function tone(type,f,t0,dur,vol,att=.01,cut){
  const c=BGM.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
  let out=o;if(cut){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);out=fl}
  out.connect(g);g.connect(BGM.master);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+att);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.start(t0);o.stop(t0+dur+.05);
}
function bgmStep(t0){
  const c=BGM.ctx,st=BGM.step%16,mood=s&&(s.profit<0||s.cash<0)?'down':'up';
  const ch=PROG[mood][BGM.bar%4],sp=60/84/4;
  if(st===0){ // 패드 화음
    ch.c.forEach((n,i)=>{tone('triangle',midi(n)*(i%2?1.003:.997),t0,sp*16*1.1,.028,.5,1400)});
    tone('sine',midi(ch.b),t0,sp*7,.16,.02);
  }
  if(st===8)tone('sine',midi(ch.b+(BGM.bar%2?7:0)),t0,sp*6,.13,.02);
  if(st===14&&BGM.bar%2)tone('sine',midi(ch.b+12),t0,sp*2,.08,.01);
  // 아르페지오: 마디마다 조금씩 다른 패턴
  const pat=[[0,3,6,10,12],[0,4,6,8,11,14],[2,6,10,13],[0,3,7,10,12,15]][BGM.bar%4];
  if(pat.includes(st)){const n=ch.c[(st+BGM.bar)%4]+12+(st>=12?12:0);tone('triangle',midi(n),t0,.35,.035,.005,2600)}
  if(st%4===2){ // 살짝 하이햇
    const n=c.createBufferSource(),hp=c.createBiquadFilter(),g=c.createGain();n.buffer=BGM.noise;hp.type='highpass';hp.frequency.value=7000;
    n.connect(hp);hp.connect(g);g.connect(BGM.master);g.gain.setValueAtTime(.025,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.05);n.start(t0);n.stop(t0+.06);
  }
  if(st===0||st===8){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(110,t0);o.frequency.exponentialRampToValueAtTime(45,t0+.12);
    o.connect(g);g.connect(BGM.master);g.gain.setValueAtTime(.22,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.18);o.start(t0);o.stop(t0+.2)}
  BGM.step++;if(BGM.step%16===0)BGM.bar++;
}
function bgmSchedule(){
  const c=BGM.ctx,sp=60/84/4;
  while(BGM.next<c.currentTime+.25){bgmStep(BGM.next);BGM.next+=sp}
}
function bgmStart(){
  if(!SET.bgm||!bgmInit())return;
  const c=BGM.ctx;c.resume?.();
  if(!BGM.timer){BGM.next=c.currentTime+.08;BGM.timer=setInterval(bgmSchedule,60)}
  BGM.master.gain.cancelScheduledValues(c.currentTime);
  BGM.master.gain.setTargetAtTime(SET.vol*.55,c.currentTime,.4);
}
function bgmStop(){
  if(!BGM.ctx||!BGM.timer)return;
  const c=BGM.ctx;BGM.master.gain.setTargetAtTime(0,c.currentTime,.15);
  const tm=BGM.timer;BGM.timer=0;setTimeout(()=>{clearInterval(tm);if(!BGM.timer)c.suspend?.()},600);
}
function setBgm(on){SET.bgm=on;saveSet();on?bgmStart():bgmStop();document.querySelectorAll('.bgm-ic').forEach(b=>b.textContent=on?'🔊':'🔇')}
document.addEventListener('pointerdown',()=>{if(SET.bgm&&!BGM.timer)bgmStart()},{capture:true});
document.addEventListener('visibilitychange',()=>{if(!BGM.ctx)return;if(document.hidden)BGM.ctx.suspend?.();else if(SET.bgm&&BGM.timer)BGM.ctx.resume?.()});

  m.querySelectorAll('#set-theme button').forEach(b=>b.onclick=()=>{SET.theme=b.dataset.o;saveSet();m.querySelectorAll('#set-theme button').forEach(x=>x.classList.toggle('on',x===b));applyTheme()});

  buysecret:{n:L`기밀 거래`,big:L`179건 검거`,t:L`2025년 경찰은 기술 유출 범죄 179건, 378명을 검거했어요. 1년 전보다 45.5% 늘었고, 해외로 빼돌린 사건의 절반 이상(54.5%)은 중국으로 향했어요.`,src:L`경찰청 2025 기술유출 범죄 단속 결과(보안뉴스)`},

  hiring:{n:L`외국인 인력`,big:L`13만 명`,t:L`2025년 정부가 들여온 비전문 외국인 근로자(E-9) 쿼터는 13만 명이에요. 2024년 16만 5천 명에서 21% 줄었고, 2026년에는 8만 명으로 더 줄었어요.`,src:L`고용노동부 외국인력정책위원회(2024.12)`},
  superaged:{n:L`초고령사회`,big:'20.00%',t:L`2024년 12월, 한국은 65세 이상 인구가 20%를 넘어 초고령사회가 됐어요. 고령사회에서 초고령사회까지 독일은 37년, 프랑스는 39년 걸렸지만 한국은 7년 만이었어요.`,src:L`행정안전부 주민등록 인구통계(2024.12.24)`},
  yellow:{n:L`노란봉투법`,big:L`20년 만`,t:L`노동계가 20년 넘게 요구해 온 노조법 2·3조 개정안(노란봉투법)이 2025년 8월 국회를 통과해 2026년 3월 시행됐어요. 하청 노동자도 실질적 지배력이 있는 원청과 직접 교섭할 수 있게 됐어요.`,src:L`국회 본회의(2025.8.24) · 고용노동부`},
  cbam:{n:L`탄소국경세`,big:L`6개 품목`,t:L`EU는 2026년부터 철강·알루미늄·시멘트·비료·수소·전기 6개 품목에 탄소국경조정제도(CBAM)를 적용해요. 실제 인증서 비용은 2027년부터 내고, 국내 철강업계 부담은 연 3천억 원 가까이로 추산돼요.`,src:L`EU 집행위원회 · 에너지경제연구원 · 업계 추산(언론 보도)`},
  pension:{n:L`국민연금 개혁`,big:'9% → 13%',t:L`2025년 3월, 18년 만에 국민연금이 개혁됐어요. 보험료율은 9%에서 13%로 2026년부터 매년 0.5%p씩 오르고, 소득대체율은 43%가 돼요. 직장인 보험료의 절반은 회사가 내요.`,src:L`국민연금법 개정(국회 2025.3.20)`},
  delivery:{n:L`배달앱 수수료`,big:'9.8% → 2~7.8%',t:L`2024년 11월 배달앱 상생협의체는 9.8%였던 중개 수수료를 매출에 따라 2.0~7.8%로 낮추기로 합의했어요. 대신 점주 배달비는 건당 최대 500원 늘어, 부담이 줄지 않았다는 목소리도 커요.`,src:L`배달플랫폼 상생협의체 합의(2024.11)`},
  kbeauty:{n:L`K-뷰티`,big:L`114억 달러`,t:L`2025년 한국 화장품 수출은 114억 달러로 역대 최대예요. 프랑스에 이어 세계 2위 화장품 수출국이 됐고, 미국이 중국을 제치고 최대 수출 시장이 됐어요. 2012년(11억 달러)보다 10배 넘게 컸어요.`,src:L`식품의약품안전처 2025년 화장품 수출 실적`},
  kfood:{n:L`K-라면`,big:L`15억 달러`,t:L`2025년 라면 수출은 15억 2,140만 달러로 1년 새 21.9% 늘어 역대 최대예요. K-푸드 전체 수출도 136억 2천만 달러로 최고 기록을 세웠어요.`,src:L`농림축산식품부 2025년 K-푸드+ 수출 실적`},
  biodeal:{n:L`바이오 기술수출`,big:L`약 20조 원`,t:L`2025년 한국 제약·바이오 기업의 기술수출은 145억 달러(약 20조 원)로 역대 최대예요. 1년 새 2.6배가 됐고, 가장 큰 계약 하나가 약 4조 1천억 원이었어요.`,src:L`한국제약바이오협회 집계(언론 보도)`},
  panho:{n:L`중국 판호`,big:L`95건`,t:L`2025년 중국이 허가한 게임 1,771종 중 해외 게임(외자판호)은 95건, 약 5%뿐이에요. 2022년엔 44건까지 줄었다가 회복 중이지만, 판호를 받아도 흥행은 별개라는 게 업계 얘기예요.`,src:L`중국 국가신문출판서(NPPA) 공고 · 한국콘텐츠진흥원`},
  workweek:{n:L`주 4.5일제`,big:L`347곳`,t:L`2026년 정부 주 4.5일제 시범사업에 347개 사업장이 참여했어요. 임금은 그대로 두고 근무시간을 줄이는 조건이고, 근로자 1인당 최대 80만 원을 지원해요. 참여 기업의 67.9%가 50인 미만 중소기업이에요.`,src:L`고용노동부 「워라밸+4.5 프로젝트」(2026)`},
  fx:{n:L`환율`,big:L`1,422원`,t:L`2025년 원·달러 환율은 연평균 약 1,422원으로 1998년 외환위기 때(1,395원)보다도 높은 역대 최고였어요. 수출 기업엔 호재지만, 원자재를 수입하는 회사는 비용이 크게 늘어요.`,src:L`서울외환시장 집계(헤럴드경제·뉴시스 보도)`},
  greenwash:{n:L`그린워싱`,big:'99.8%',t:L`최근 3년간 국내에서 적발된 그린워싱(가짜 친환경 광고)은 4,940건인데, 그중 99.8%가 강제력 없는 행정지도로 끝났어요. 적발 건수는 2020년 110건에서 2024년 2,528건으로 급증했어요.`,src:L`환경부·한국환경산업기술원 자료(언론 보도)`},
  origin:{n:L`원산지 표시`,big:L`142곳`,t:L`2025년 김장철 40일 동안 농관원이 4만 7,831곳을 점검해 배추김치·양념 원산지를 속인 142곳을 적발했어요. 거짓 표시 101곳은 형사 입건됐어요.`,src:L`국립농산물품질관리원(2025.12)`},
  fraud:{n:L`회계 감리`,big:'47%',t:L`2022~2024년 금융감독원이 재무제표를 심사·감리한 458개 회사 중 214곳(약 47%)이 제재를 받았어요. 가장 많이 지적되는 건 매출을 부풀리거나 손실을 늦게 반영하는 거예요.`,src:L`금융감독원 보도자료(2025.5)`},
  disrupt:{n:L`기업 수명`,big:L`33년 → 14년`,t:L`미국 S&P 500 기업이 지수에 머무는 평균 기간은 1965년 33년에서 1990년 20년으로 줄었고, 2026년엔 14년까지 짧아질 것으로 예측됐어요. 파괴적 혁신 앞에선 대기업도 오래 버티기 어려워요.`,src:'Innosight 「Corporate Longevity Forecast」(2021)'},
  venture:{n:L`벤처투자`,big:L`13.6조 원`,t:L`2025년 국내 벤처투자는 13조 6천억 원으로 역대 두 번째로 많았고, 투자 건수(8,542건)는 역대 최다였어요. 같은 해 말 한국의 유니콘은 27개였어요.`,src:L`중소벤처기업부 「2025년 벤처투자 동향」(2026.2)`},
  itoutage:{n:L`글로벌 IT 장애`,big:L`850만 대`,t:L`2024년 7월 한 보안 소프트웨어의 잘못된 업데이트로 전 세계 윈도 PC 약 850만 대가 멈췄어요. 미국 포춘 500대 기업 손실만 54억 달러, 전 세계로는 약 150억 달러로 추산돼요. 한 항공사는 혼자 5억 달러를 잃었어요.`,src:L`Microsoft · Parametrix 추산(2024)`},
  ott:{n:L`글로벌 OTT`,big:L`25억 달러`,t:L`2023년 넷플릭스는 4년간 한국 콘텐츠에 25억 달러(약 3조 3천억 원)를 투자하겠다고 발표했어요. 2016년 한국 진출 이후 투자한 금액의 2배예요. 넷플릭스 가입자의 60% 이상이 한국 콘텐츠를 봐요.`,src:L`Netflix 발표(2023.4) · Axios · TechCrunch`},
  kpopanim:{n:L`K-팝 애니메이션`,big:L`2억 3,600만 뷰`,t:L`2025년 애니메이션 〈케이팝 데몬 헌터스〉는 넷플릭스 역대 가장 많이 본 영화(2억 3,600만 뷰)가 됐어요. 주제곡 ‘Golden’은 빌보드 핫100 1위에 올라, K-팝 여성 보컬 곡으로는 처음이었어요.`,src:'Netflix Tudum · Billboard(2025)'},
  ccommerce:{n:L`해외직구`,big:L`8.5조 원`,t:L`2025년 한국인의 해외직구는 8조 5천억 원을 넘어 역대 최대였어요. 그중 중국 직구가 5조 5천억 원(약 65%)이고, 통관 건수로는 79.4%가 중국발이에요.`,src:L`국가데이터처 온라인쇼핑 동향 · 관세청(2026)`},
  cocoa:{n:L`원자재 가격`,big:L`톤당 12,565달러`,t:L`카카오 선물 가격은 2024년 12월 톤당 12,565달러로 사상 최고를 찍었어요. 초콜릿 회사들은 줄줄이 값을 올렸고, 미국 초콜릿 바 평균 가격은 4년 새 41% 올랐어요.`,src:L`ICE 카카오 선물 · Fortune · NielsenIQ(2025)`},
  smish:{n:L`보이스피싱`,big:L`1조 2,578억 원`,t:L`2025년 한국 보이스피싱 피해액은 1조 2,578억 원으로 처음 1조 원을 넘었어요. 한 번 당하면 평균 5,384만 원을 잃고, 피해의 78.6%가 기관·기업을 사칭한 수법이었어요.`,src:L`경찰청 자료(국회의원실 분석, 2026)`},
  parental:{n:L`육아휴직`,big:'36.4%',t:L`2025년 육아휴직자 중 아빠 비율이 36.4%(약 6만 7천 명)로 역대 최고였어요. 1년 새 남성 육아휴직자가 60% 넘게 늘었어요.`,src:L`고용노동부 육아휴직 통계(2026)`},
  firesafety:{n:L`공장 화재`,big:L`23명`,t:L`2024년 6월 경기 화성의 리튬 배터리 공장 화재로 23명이 숨졌어요. 대표는 2025년 9월 1심에서 중대재해처벌법 위반 등으로 징역 15년을 선고받았어요. 안전 투자를 미룬 대가는 회사 전체를 무너뜨려요.`,src:L`경찰·법원 발표(언론 보도, 2024~2025)`},
  sandbox:{n:L`규제샌드박스`,big:L`1,750여 건`,t:L`2019년 도입된 규제샌드박스로 2025년 초까지 1,750여 건의 신사업이 임시 허가를 받았어요. 다만 법이 실제로 바뀐 건 약 21%뿐이라, 허가 기간이 끝나면 다시 막히는 기업도 많아요.`,src:L`국무조정실 규제샌드박스 현황(언론 보도)`},
  fakes:{n:L`K-브랜드 짝퉁`,big:L`연 11조 원`,t:L`해외에서 팔리는 K-브랜드 위조상품 시장은 연 11조 원 규모로 추정돼요. 최근 5년 동안 중국에서 한국 브랜드를 먼저 등록한 것으로 의심되는 상표가 1만 건이 넘었어요.`,src:L`OECD 분석 기반 추정 · 지식재산처(언론 보도)`},
  us_svb:{cc:'US',n:L`뱅크런`,big:L`하루 420억 달러`,t:L`2023년 3월 실리콘밸리은행(SVB)에서 하루 만에 420억 달러(예금의 약 4분의 1) 인출 요청이 몰려 은행이 다음 날 문을 닫았어요. 예금의 88%가 보호 한도를 넘는 돈이었고, 미국 역사상 세 번째로 큰 은행 파산이었어요.`,src:L`캘리포니아 금융감독 당국 문서 · Bloomberg · Fortune(2023)`},
  us_layoff:{cc:'US',n:L`빅테크 해고`,big:L`26만 명`,t:L`2023년 전 세계 테크 기업에서 26만 2,735명이 해고됐어요(Layoffs.fyi 집계). 2024년에도 549개 회사에서 15만 명 넘게 일자리를 잃었어요.`,src:'Layoffs.fyi · TechCrunch'},
  us_h1b:{cc:'US',n:L`H-1B 비자`,big:L`10만 달러`,t:L`2025년 9월 미국은 새 H-1B 취업비자 신청에 한 건당 10만 달러(약 1억 4천만 원)를 물리는 포고령을 냈어요. 기존 비자 연장은 빠졌고, 미국 상공회의소는 소송을 냈어요.`,src:L`백악관 포고령 10973(2025.9) · DLA Piper`},
  us_bf:{cc:'US',n:L`블랙프라이데이`,big:L`118억 달러`,t:L`2025년 블랙프라이데이 하루 미국 온라인 매출은 118억 달러로 역대 최대였어요. 사흘 뒤 사이버먼데이는 142억 5천만 달러로 하루 매출 신기록을 세웠어요.`,src:'Adobe Analytics(2025)'},
  jp_shunto:{cc:'JP',n:L`춘투`,big:'5.25%',t:L`2025년 일본 춘투에서 노조연합(렌고) 소속 5,162개 기업의 평균 임금 인상률은 5.25%로, 2년 연속 5%를 넘었어요. 다만 중소기업은 4.65%에 그쳤어요.`,src:L`일본노동조합총연합회(렌고) 최종 집계(2025.7)`},
  jp_labor:{cc:'JP',n:L`일손 부족 도산`,big:L`397건`,t:L`2025년 일본에서 일손 부족으로 쓰러진 회사는 397곳으로, 1년 새 36% 늘어 통계 이래 최다였어요. 전체 도산도 2년 연속 1만 건을 넘었어요.`,src:L`도쿄상공리서치(TSR) 2025년 도산 집계`},
  jp_yen:{cc:'JP',n:L`엔저`,big:L`1달러 160엔`,t:L`2024년 6월 엔화는 1달러에 160엔을 넘어 1986년 이후 가장 약해졌어요. 일본 정부는 그해 4~5월에만 약 9조 8천억 엔을 써서 환율을 방어했어요.`,src:L`Bloomberg · 일본 재무성(2024)`},
  cn_price:{cc:'CN',n:L`가격 전쟁`,big:L`최대 34%`,t:L`2025년 5월 중국 최대 전기차 회사가 20여 개 모델 값을 최대 34% 내리자 경쟁사들이 줄줄이 따라 내렸어요. 2년 새 중국 평균 자동차 가격은 약 19% 떨어졌고, 정부는 “원가 이하 판매 금지”를 경고했어요.`,src:'Reuters · Bloomberg · Financial Times(2025)'},
  cn_rare:{cc:'CN',n:L`희토류 통제`,big:'0.1%',t:L`2025년 10월 중국은 중국산 희토류가 0.1%만 들어가도 수출 허가를 받게 하는 통제를 발표했다가, 미중 정상회담 뒤 1년간 유예했어요. 그사이 희토류 자석 수출은 두 달 연속 줄었어요.`,src:L`S&P Global · 중국 해관총서 통계(2025)`},

// 한국 통계는 한국 회사에서만 보여 준다(다른 나라는 그 나라·세계 통계만)
const FACT_GLOBAL=['ransom','deepfake','embezzle','whistle','patenttroll','recall','clinic','cbam','panho','disrupt','itoutage','cocoa'];
const factFits=k=>{const f=FACTS[k];if(!f)return false;if(f.cc)return f.cc===((s&&s.cc)||'KR');return ((s&&s.cc)||'KR')==='KR'||FACT_GLOBAL.includes(k)};
const factQ=[];
function factCard(f){return L`<div class="fact"><div class="fh">📊 실제 세계에서는</div><span class="big">${f.big}</span>${f.t}<span class="src">출처: ${f.src}</span></div>`}
function seenFacts(){try{return JSON.parse(localStorage.getItem('kcorp-facts')||'[]')}catch(e){return []}}
function markFact(k){const a=seenFacts();if(!a.includes(k)){a.push(k);try{localStorage.setItem('kcorp-facts',JSON.stringify(a))}catch(e){}}}
function showFact(title,html){
  const go=()=>modal(title,html,[{l:L`계속하기`,f:()=>{}}],'event');
  if(document.getElementById('modal-root').firstChild)factQ.push(go);else go();
}
function factLibrary(){
  const seen=seenFacts(),all=[...Object.entries(MILES),...Object.entries(FACTS)];
  modal(L`📚 실제 통계 모음`,L`<p class="muted" style="margin:0 0 6px;font-size:13px">위기를 넘기거나 기록을 세우면 하나씩 열려요. (${all.filter(([k])=>seen.includes(k)).length}/${all.length})</p><ul class="fact-list">${all.map(([k,f])=>seen.includes(k)?L`<li><b>${f.n}</b> · <b style="color:var(--accent)">${f.big}</b><br>${f.t}<br><span class="muted" style="font-size:11px">출처: ${f.src}</span></li>`:`<li class="lock">🔒 ${f.n}</li>`).join('')}</ul>`,[{l:L`닫기`,f:()=>{}}]);
}
function milestone(k,title){markFact(k);const f=MILES[k];pendingFx.push(()=>showFact(title,`<p style="margin:0">${f.t.split('. ')[0]}.</p>${factCard(f)}`))}

// ===== 공유 =====
const SITE_URL='https://daehwi123123-dev.github.io/k-corp/';
async function shareText(text){
  const data={title:L`재벌까지`,text,url:SITE_URL};
  try{if(navigator.share){await navigator.share(data);return}}catch(e){if(e&&e.name==='AbortError')return}
  const full=`${text}\n${SITE_URL}`;
  try{await navigator.clipboard.writeText(full);toast(L`<b>📋 복사했어요</b><br>카톡·SNS에 붙여넣기 하세요`,'good');return}catch(e){}
  modal(L`📣 공유하기`,L`<p class="muted" style="font-size:13px;margin:0 0 8px">아래 글을 길게 눌러 복사하세요.</p><textarea class="fb-ta" readonly style="min-height:120px">${esc(full)}</textarea>`,[{l:L`닫기`,f:()=>{}}]);
}
function resultText(type){
  const C=cc(),months=s.t||0,yt=L`${Math.floor(months/12)}년 ${months%12}개월`;
  const who=L`${C.flag} ${C.n}의 ‘${s.name}’`;
  const T={
    win:L`${who}을(를) ${yt} 만에 기업가치 100조 원 그룹으로 키웠어요! 👑`,
    bankrupt:L`${who}, ${yt} 버티다 결국 부도났어요… 💸 (최고 기업가치 ${wonKRW(s.maxVal)})`,
    fired:L`${who} 대표였는데 지분을 너무 팔아서 ${yt} 만에 해임됐어요… 🪑`,
    takeover:L`${who}, ${yt} 만에 적대적 M&A로 경영권을 뺏겼어요… ⚔️`,
    sold:L`${who}을(를) ${yt} 만에 매각하고 엑시트했어요! 🤝`,
  }[type]||L`${who}을(를) ${yt}째 경영 중이에요. 지금 기업가치 ${wonKRW(s.valuation)}!`;
  return L`${T}\n랜덤 회사로 재벌에 도전하는 경영 시뮬레이션 「재벌까지」 — 너는 몇 년 만에 가능할까? 🏢`;
}

// ===== 시작 =====
function migrate(st){
  if(!st)return st;
  const prev=s;s=st;
  if(!s.rivals)genRivals(s);
  if(s.hq===undefined){s.hq=HQ.findIndex(h=>h.cap>=s.employees);s.ips=[];s.ipRev=0}
  if(s.t===undefined){s.t=0;s.lastLaunch=0}
  if(s.week===undefined){s.week=1;s.weekCash=0}
  if(!s.evT)s.evT={};
  if(!s.cc)s.cc='KR';
  if(s.allies===undefined){s.allies=s.flags&&s.flags.heir?15:0;s.raid=null;s.buyT=-1}
  s=prev;return st;
}
s=migrate(loadSave());
if(!(s&&!s.over))s=null;
showTitle();
initCloud();
