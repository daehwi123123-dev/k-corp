<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>재벌까지</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1b1f24;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent-soft:#e3ebff;--good:#15803d;--bad:#dc2626;--warn:#b45309;--chip:#f1f3f6;--shadow:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--text:#e7e9ee;--muted:#9aa3b2;--line:#2a2f38;--accent:#6b97ff;--accent-soft:#1e2a4a;--good:#34d399;--bad:#f87171;--warn:#fbbf24;--chip:#222730;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--text:#e7e9ee;--muted:#9aa3b2;--line:#2a2f38;--accent:#6b97ff;--accent-soft:#1e2a4a;--good:#34d399;--bad:#f87171;--warn:#fbbf24;--chip:#222730;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.co-name{font-size:22px;font-weight:800;letter-spacing:-.5px}
.co-sub{color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;vertical-align:middle;margin-left:6px}
.date{font-weight:700;font-size:16px}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:12px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--chip);border-radius:8px;padding:8px 10px;min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{margin-top:10px;display:grid;gap:6px}
.bar{display:grid;grid-template-columns:56px 1fr 44px;align-items:center;gap:8px;font-size:12px}
.bar .track{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .num{text-align:right;font-weight:700}
.pos{color:var(--good)}.neg{color:var(--bad)}.warn{color:var(--warn)}
.ap{display:flex;gap:4px}
.ap i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.ap i.used{background:var(--line)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:480px){.actions{grid-template-columns:repeat(2,1fr)}}
.act{background:var(--chip);border:1px solid transparent;border-radius:10px;padding:9px 10px;text-align:left;min-height:74px;display:flex;flex-direction:column;gap:2px}
.act:hover:not(:disabled){border-color:var(--accent)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act .n{font-weight:800}
.act .d{font-size:12px;color:var(--muted)}
.act .c{font-size:12px;font-weight:700;margin-top:auto}
.fin{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.next{width:100%;padding:14px;font-size:16px;border-radius:12px;margin-bottom:12px}
.report li,.log li{margin:0 0 6px;padding-left:2px}
.report ul,.log ul{list-style:none;margin:0;padding:0}
.log{max-height:340px;overflow:auto}
.log .d{color:var(--muted);font-size:12px;margin-right:6px}
.prod{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.prod:last-child{border-bottom:none}
.muted{color:var(--muted)}
canvas{width:100%;height:90px;display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--card);border-radius:14px;max-width:440px;width:100%;padding:20px;border:1px solid var(--line);max-height:90vh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:19px}
.modal .body{margin-bottom:16px}
.modal .btns{display:flex;flex-direction:column;gap:8px}
.modal .btns .btn{padding:11px;text-align:left}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0}
.kv b{font-weight:700}
.hidden{display:none}
.rv{padding:10px 0;border-bottom:1px dashed var(--line)}
.rv:first-of-type{padding-top:0}
.rv.me .rv-name{color:var(--accent)}
.rv-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.rv-rank{width:20px;height:20px;border-radius:50%;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.rv-val{margin-left:auto;font-weight:700}
.rv-info{font-size:12px;margin:4px 0 6px;line-height:1.5}
.rv-buy{font-size:12px;padding:4px 10px}
.ctl-bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--chip);margin:8px 0 6px}
.ctl-bar span{height:100%;transition:width .6s}
.ctl-me{background:var(--accent)}.ctl-al{background:color-mix(in srgb,var(--accent) 45%,var(--chip))}.ctl-rd{background:var(--bad)}
.ctl-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.ctl-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.ctl-st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--chip)}
.ctl-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ctl-btns .btn{font-size:12px;padding:5px 10px}
.card.raid{border:1px solid var(--bad)}
.rv-log{color:var(--accent)}
/* ===== 연출 ===== */
.bar .fill{transition:width .8s cubic-bezier(.2,.8,.2,1)}
.act,.btn{transition:transform .12s,border-color .15s,box-shadow .15s}
.act:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.act:active:not(:disabled),.btn:active:not(:disabled){transform:scale(.95)}
.stat.up{animation:flashUp 1s}
.stat.down{animation:flashDown 1s}
@keyframes flashUp{0%{background:color-mix(in srgb,var(--good) 28%,var(--chip))}100%{background:var(--chip)}}
@keyframes flashDown{0%{background:color-mix(in srgb,var(--bad) 28%,var(--chip))}100%{background:var(--chip)}}
.bar.up .num{animation:popNum .6s}.bar.down .num{animation:popNum .6s;color:var(--bad)}
@keyframes popNum{40%{transform:scale(1.35)}}
.floater{position:fixed;z-index:60;pointer-events:none;font-weight:800;font-size:14px;white-space:nowrap;transform:translate(-50%,0);animation:floatUp 1.25s ease-out forwards;text-shadow:0 1px 0 var(--card),0 0 6px var(--card)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,380px);pointer-events:none}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);width:100%;font-size:13px;animation:toastIn .45s cubic-bezier(.2,1.4,.4,1)}
.toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--bad)}
.toast.out{animation:toastOut .4s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-24px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-16px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(var(--r))}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:55;box-shadow:inset 0 0 120px rgba(220,38,38,.55);animation:fadeOut .7s forwards}
@keyframes fadeOut{to{opacity:0}}
.modal-bg{animation:bgIn .2s}
.modal{animation:popIn .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes bgIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(20px) scale(.92)}}
.modal.event{border-top:4px solid var(--bad)}
.news-tag{display:inline-block;background:var(--bad);color:#fff;font-weight:800;font-size:11px;padding:2px 8px;border-radius:4px;letter-spacing:2px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.cal-ov{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;animation:bgIn .2s}
.cal-ov.out{animation:fadeOut .3s forwards}
.cal{width:150px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);text-align:center;animation:popIn .3s}
.cal-head{background:var(--bad);color:#fff;font-weight:800;padding:6px;letter-spacing:1px}
.cal-body{position:relative;height:110px;perspective:500px}
.cal-page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;background:var(--card);backface-visibility:hidden;transform-origin:top center}
.cal-page small{font-size:18px;margin-left:2px;align-self:flex-end;margin-bottom:28px}
.cal-page.old{animation:flip .55s .2s ease-in forwards}
@keyframes flip{to{transform:rotateX(-100deg);opacity:0}}
.cal-foot{font-size:12px;color:var(--muted);padding:6px}
.dev{text-align:center;padding:6px 0}
.dev-icon{font-size:46px;animation:wobble .5s infinite alternate}
@keyframes wobble{from{transform:rotate(-12deg)}to{transform:rotate(12deg) translateY(-4px)}}
.dev-step{font-weight:700;margin:8px 0 10px;min-height:20px}
.prog{height:10px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#a855f7);transition:width 1.8s linear}
.reveal{text-align:center;padding:4px 0}
.rv-label{font-weight:800;font-size:15px;animation:popIn .4s}
.rv-pname{font-size:22px;font-weight:900;margin:6px 0;animation:popIn .5s}
.rv-q{font-size:15px}.rv-q span{font-size:30px;font-weight:900;color:var(--accent)}
.reveal.hit .rv-pname{background:linear-gradient(90deg,#f59e0b,#f43f5e,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.reveal.flop{opacity:.85}.reveal.flop .rv-q span{color:var(--muted)}
.stars{font-size:26px;color:#f59e0b;letter-spacing:2px;margin:4px 0}
.stars span{display:inline-block;opacity:0;animation:starIn .35s forwards}
@keyframes starIn{from{opacity:0;transform:scale(2.2) rotate(-30deg)}to{opacity:1;transform:none}}
.report.fresh li{opacity:0;animation:slideIn .4s forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.log li.new{animation:newLog 1.6s}
@keyframes newLog{0%{background:var(--accent-soft);transform:translateX(10px)}20%{transform:none}100%{background:transparent}}
.next.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.stat .dl{font-size:11px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.stat .dl.pos{color:var(--good)}.stat .dl.neg{color:var(--bad)}
.stat .dl .muted{font-weight:400}
.prod2{padding:9px 0;border-bottom:1px dashed var(--line);display:grid;gap:3px}
.prod2:first-of-type{padding-top:0}
.p-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.p-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-rev{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}.p-rev small{font-weight:400;color:var(--muted)}
.p-sub{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.p-right{display:flex;gap:8px;align-items:center;white-space:nowrap}
.p-del{font-size:11px;padding:2px 8px;color:var(--muted)}
.p-total{display:flex;justify-content:space-between;padding-top:8px;font-size:13px}
.slots{display:grid;gap:8px}
.slot{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--chip);border-radius:10px;padding:10px 12px}
.slot-info{display:flex;flex-direction:column;min-width:0;font-size:13px;line-height:1.4}
.slot-info span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-btns{display:flex;gap:6px;flex-shrink:0}
.slot-btns .btn{padding:6px 10px;font-size:12px}
.btn.warnbtn{border-color:var(--bad);color:var(--bad)}
.start-sc{border-radius:10px;padding:10px 12px;background:var(--chip);border-left:4px solid var(--accent)}
.start-sc p{margin:6px 0 0;font-size:13px}
.start-sc .badge{margin-left:8px}
.sc-midcap{border-left-color:var(--warn)}.sc-chaebol2{border-left-color:var(--bad)}.sc-venture{border-left-color:var(--good)}
/* 하단 고정 '다음 달' 바 */
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
#scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#nextbar{flex:0 0 auto;position:relative;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nb-in{max-width:1008px;margin:0 auto;display:flex;gap:12px;align-items:center}
.nb-info{display:flex;flex-direction:column;font-size:12px;color:var(--muted);white-space:nowrap;line-height:1.35}
.nb-info>b{font-size:14px;color:var(--text)}
#nextbar .next{margin:0;flex:1;padding:13px;display:flex;align-items:center;justify-content:center;gap:10px}
#nextbar .next .ap i{background:#fff}#nextbar .next .ap i.used{background:rgba(255,255,255,.35)}
.modal-bg{z-index:40}
/* ===== 회사 장면 ===== */
:root{--sky1:#cfe8ff;--sky2:#f2f8ff;--ground:#cfe3b8;--ground2:#a9c98a;--bld:#e9e3d8;--bld2:#9aa3ae;--bld3:#d5d9df;--glass:#bcd4ea;--win:#a3b6ca;--win2:#c9d1da;--winlit:#ffd66b;--cloud:#ffffff;--tree:#6cbf6c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky1:#0d1a2e;--sky2:#1b2a44;--ground:#1f2d22;--ground2:#2e4433;--bld:#2c313b;--bld2:#4b5563;--bld3:#232832;--glass:#2b3d55;--win:#1a2230;--win2:#20262f;--winlit:#ffcf4d;--cloud:#34425b;--tree:#2f6b3a;color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#0d1a2e;--sky2:#1b2a44;--ground:#1f2d22;--ground2:#2e4433;--bld:#2c313b;--bld2:#4b5563;--bld3:#232832;--glass:#2b3d55;--win:#1a2230;--win2:#20262f;--winlit:#ffcf4d;--cloud:#34425b;--tree:#2f6b3a;color-scheme:dark}
.scene{padding:0;overflow:hidden;position:relative;background:linear-gradient(var(--sky1),var(--sky2))}
.scene svg{display:block;width:100%;height:clamp(190px,28vw,270px)}
.scene-cap{position:absolute;left:10px;bottom:8px;font-size:12px;background:color-mix(in srgb,var(--card) 88%,transparent);padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
#crowd>g{transition:opacity .8s}
.ch.walk{animation:walkX linear infinite}
.ch.idle{transform:translateX(var(--x0))}
.ch.walk .face{animation-name:face;animation-timing-function:linear;animation-iteration-count:infinite;transform-box:fill-box;transform-origin:center}
@keyframes walkX{0%{transform:translateX(var(--x0))}50%{transform:translateX(var(--x1))}100%{transform:translateX(var(--x0))}}
@keyframes face{0%,49.9%{transform:scaleX(var(--f1))}50%,100%{transform:scaleX(var(--f2))}}
.bob{animation:bob .32s ease-in-out infinite alternate}.idle .bob{animation-duration:1.3s}
@keyframes bob{to{transform:translateY(-1.3px)}}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:swing .32s ease-in-out infinite alternate}.leg.r{animation-direction:alternate-reverse}.idle .leg{animation:none}
@keyframes swing{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.bubble{animation:bub 2.2s forwards}
@keyframes bub{0%{opacity:0;transform:translateY(5px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.cloud.c1{animation:cloud 70s linear infinite}.cloud.c2{animation:cloud 95s linear -40s infinite}
@keyframes cloud{from{transform:translateX(-90px)}to{transform:translateX(740px)}}
.truck{animation:truck 13s linear infinite}
@keyframes truck{0%{transform:translate(-90px,188px)}55%,100%{transform:translate(760px,188px)}}
.twinkle{animation:tw 2.6s ease-in-out infinite alternate}@keyframes tw{to{opacity:.5}}
.flag{transform-box:fill-box;transform-origin:left center;animation:flag 1.1s ease-in-out infinite alternate}@keyframes flag{to{transform:scaleX(.8) skewY(5deg)}}
.crowdwarn{animation:blink 1s infinite}
#bldg{transform-box:fill-box;transform-origin:50% 100%}
#bldg.rise{animation:rise 1s cubic-bezier(.2,1.25,.4,1)}
@keyframes rise{from{transform:translateY(30px) scaleY(.2);opacity:0}}
.ipdots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin:4px 3px 0 0}.ipdots i.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.report.fresh li,.stars span{opacity:1}.ch{transform:translateX(var(--x0))!important}}

/* ===== 타이틀 화면 ===== */
#title{position:fixed;inset:0;z-index:35;overflow-y:auto;background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--accent) 22%,var(--bg)) 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px))}
#title.out,.t-out{animation:tOut .35s ease forwards}
.t-out{position:fixed;inset:0;z-index:35;overflow:hidden;pointer-events:none;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:20px 16px}
@keyframes tOut{to{opacity:0;transform:scale(1.03)}}
.t-in{width:100%;max-width:440px;margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.t-hero{width:100%;max-width:360px;aspect-ratio:36/20;margin-bottom:4px}
.t-hero .tb{transform-box:fill-box;transform-origin:50% 100%;animation:tGrow 1s cubic-bezier(.2,1.2,.4,1) both}
@keyframes tGrow{from{transform:scaleY(0)}}
.t-hero .tw{animation:tWin 3s infinite}
@keyframes tWin{0%,100%{opacity:.35}50%{opacity:1}}
.t-hero .tp{animation:tWalk 7s linear infinite}
@keyframes tWalk{from{transform:translateX(-30px)}to{transform:translateX(390px)}}
.t-hero .tl{stroke-dasharray:400;stroke-dashoffset:400;animation:tLine 1.6s .8s ease-out forwards}
@keyframes tLine{to{stroke-dashoffset:0}}
.t-kicker{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
.t-name{font-size:40px;font-weight:900;line-height:1.1;margin:6px 0 8px;letter-spacing:-.02em}
.t-name span{color:var(--accent)}
.t-sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.t-goal{display:inline-flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;margin-bottom:22px}
.t-btns{display:flex;flex-direction:column;gap:10px;width:100%}
.t-btns .btn{width:100%;padding:14px;font-size:16px;font-weight:700;border-radius:12px;margin:0}
.t-cont{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.t-cont small{display:block;font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.t-feat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:22px}
.t-feat div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-size:12px;color:var(--muted)}
.t-feat b{display:block;font-size:20px;margin-bottom:2px}
.t-foot{font-size:11px;color:var(--muted);margin-top:18px}
@media (prefers-reduced-motion: reduce){.t-hero *{animation:none!important;stroke-dashoffset:0!important}}
.how-pg{margin:-6px 0 10px;display:flex;gap:4px}
.how-pg i{flex:1;height:4px;border-radius:2px;background:var(--line)}.how-pg i.on{background:var(--accent)}
.how ul{padding-left:0;margin:8px 0 0;list-style:none}
.how li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.how li:last-child{border:0}
.how li>b:first-child{font-size:18px;line-height:1.2;flex:0 0 24px;text-align:center}
.how li span{flex:1}
.how .lead{margin:0 0 4px}
.how .ladder{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.how .ladder div{display:flex;justify-content:space-between;background:var(--chip);border-radius:8px;padding:6px 10px}

/* 피드백 */
.fb-types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 12px}
.fb-types button{padding:8px 2px;font-size:12px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--text);cursor:pointer;font:inherit;font-size:12px}
.fb-types button b{display:block;font-size:18px}
.fb-types button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.fb-stars{display:flex;gap:4px;margin:2px 0 12px}
.fb-stars button{font-size:26px;line-height:1;background:none;border:0;padding:2px;cursor:pointer;filter:grayscale(1);opacity:.35}
.fb-stars button.on{filter:none;opacity:1}
.fb-ta{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--card);color:var(--text)}
.fb-ta:focus{outline:2px solid var(--accent);outline-offset:-1px}
.fb-lbl{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 4px}
.fb-chk{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);margin-top:10px}

/* ===== 주 단위 진행 바 ===== */
#nextbar .nb-in{gap:8px}
.nb-play{white-space:nowrap}
@media (max-width:400px){.nb-info{font-size:11px}.nb-info>b{font-size:13px}#nextbar .nb-play{gap:6px;padding:12px 6px}.nb-sm{min-width:40px;padding:12px 6px}}
.nb-play{flex:1;position:relative;overflow:hidden;margin:0;padding:12px 10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800}
.nb-play .wk-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.22);width:0;pointer-events:none}
.nb-play.paused{animation:pulse 1.4s infinite}
.nb-play>*{position:relative}
.nb-play .ap i{background:#fff}.nb-play .ap i.used{background:rgba(255,255,255,.35)}
.nb-weeks{display:flex;gap:3px;margin-top:3px}.nb-weeks i{width:14px;height:4px;border-radius:2px;background:var(--line)}.nb-weeks i.on{background:var(--accent)}
.nb-sm{margin:0;padding:12px 10px;font-weight:800;min-width:46px}
/* ===== 요약 바 (상세는 팝업) ===== */
.sumbar{position:sticky;top:0;z-index:20;cursor:pointer;padding:10px 12px}
.sumbar .sb-row{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;align-items:center}
.sumbar .stat{background:none;padding:0}
.sumbar .stat .v{font-size:15px}
.sumbar .sb-more{font-size:12px;padding:6px 8px;margin:0;white-space:nowrap}
.sb-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.sb-bars .bar{grid-template-columns:1fr auto;grid-template-areas:"l n" "t t";gap:3px 6px;font-size:11px}
.sb-bars .bar>.muted{grid-area:l;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb-bars .bar .num{grid-area:n}.sb-bars .bar .track{grid-area:t;height:6px}
.sb-bars .bar:nth-child(3) .fill{background:var(--good)}
@media (max-width:420px){.sumbar .sb-row{grid-template-columns:1.25fr 1fr 1fr 34px}.sumbar .sb-more span{display:none}.sumbar .stat .v{font-size:14px}}
.modal.wide{max-width:560px}
.modal .stats{grid-template-columns:repeat(2,1fr)}
@media (min-width:480px){.modal .stats{grid-template-columns:repeat(3,1fr)}}
.modal #chart{width:100%;height:150px;display:block}

/* ===== 하단 탭 ===== */
#root{max-width:760px}
#sum{position:sticky;top:0;z-index:20}
#sum .sumbar{position:static;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tabs{max-width:760px;margin:8px auto 0;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;border-top:1px solid var(--line);padding-top:6px}
.tabs button{background:none;border:0;padding:4px 0 2px;color:var(--muted);font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;border-radius:8px}
.tabs button b{font-size:19px;line-height:1.15;filter:grayscale(.6);opacity:.75}
.tabs button.on{color:var(--accent);font-weight:800;background:var(--accent-soft)}
.tabs button.on b{filter:none;opacity:1}
.tabs button .dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
#app .stats{grid-template-columns:repeat(2,1fr)}
@media (min-width:520px){#app .stats{grid-template-columns:repeat(3,1fr)}}
#app #chart{width:100%;height:170px;display:block}
.tab-in{animation:tabIn .25s ease}
@keyframes tabIn{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion: reduce){.tab-in{animation:none}}

/* ===== 설정 ===== */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.seg button{border:0;background:none;padding:9px 4px;border-radius:9px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.set-row{margin:0 0 16px}
.set-row>.lbl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.vol{display:flex;align-items:center;gap:10px;margin-top:10px}
.vol input{flex:1;accent-color:var(--accent)}
.hb{font-size:12px;padding:4px 8px;white-space:nowrap}

/* ===== 실제 통계 카드 ===== */
.fact{margin-top:12px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55}
.fact .fh{font-weight:800;color:var(--accent);margin-bottom:4px;font-size:12px;letter-spacing:.02em}
.fact .big{font-size:22px;font-weight:900;color:var(--accent);display:block;margin:2px 0}
.fact .src{display:block;margin-top:6px;font-size:11px;color:var(--muted)}
.fact-list{list-style:none;padding:0;margin:0}.fact-list li{padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
.fact-list li.lock{color:var(--muted)}
.verdict{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;margin-bottom:6px}
.verdict.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.verdict.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
</style>

s — the bigger the royalties.</p>","\n      <div class=\"card log\"><h3>경영 일지</h3><ul>{0}</ul></div>":"<div class=\"card log\"><h3>Company log</h3><ul>{0}</ul></div>","정말 단종?":"Really retire?","<b>₩ 원화로 보기</b>":"<b>₩ Showing KRW</b>","<b>{0} {1}로 보기</b>":"<b>{0} Showing {1}</b>","🎲 새 게임":"🎲 New game","<p>지금 회사(<b>{0}</b>)를 버리고 새로 창업할까요? 진행 상황은 사라집니다.</p><p class=\"muted\" style=\"font-size:12px\">지금 게임을 남겨 두려면 먼저 💾 저장에서 다른 칸에 저장하세요.</p>":"<p>Abandon your current company (<b>{0}</b>) and start over? Your progress will be lost.</p><p class=\"muted\" style=\"font-size:12px\">To keep this game, save it to another slot under 💾 Save first.</p>","새로 창업하기":"Start a new company","몇 달 지나면 그래프가 그려집니다":"The chart appears after a few months","기초":"Basic","숙련":"Skilled","선도":"Leading","첨단":"Cutting-edge","세계 최고":"World-class","초격차":"Unrivaled","<button class=\"btn primary t-cont\" id=\"t-cont\"><span>▶ 이어하기<small>{0} · {1}년 {2}월 · {3}</small></span><span style=\"font-size:14px\">{4}</span></button>":"<button class=\"btn primary t-cont\" id=\"t-cont\"><span>▶ Continue<small>{0} · {2}/{1} · {3}</small></span><span style=\"font-size:14px\">{4}</span></button>","<div class=\"t-in\">{0}\n    <div class=\"t-kicker\">세계 기업 성장 시뮬레이션</div>\n    <h1 class=\"t-name\">재벌<span>까지</span></h1>\n    <p class=\"t-sub\">운명이 정해 준 회사 하나.<br>한국·미국·일본·중국·독일·인도의 동네 스타트업에서<br>100조 원 그룹까지.</p>\n    <div class=\"t-goal\">🏆 목표 <b>기업가치 100조 원</b></div>\n    <div class=\"t-btns\">{1}\n      <button class=\"btn {2}\" id=\"t-new\">🎲 새 회사 뽑기</button>\n      <button class=\"btn\" id=\"t-how\">📖 게임 방법</button>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\"><button class=\"btn\" id=\"t-fb\">💬 의견 보내기</button><button class=\"btn\" id=\"t-set\">⚙️ 설정</button></div></div>\n    <div class=\"t-feat\"><div><b>🌍</b>6개국 × 업종 7개<br>× 시작 4가지</div><div><b>⚔️</b>경쟁사·M&amp;A<br>경영권 분쟁</div><div><b>🚨</b>{3}가지<br>돌발 이벤트</div></div>\n    <div class=\"t-foot\">진행 상황은 자동 저장돼요 · 🎵 화면을 누르면 배경음악이 시작돼요</div></div>":"<div class=\"t-in\">{0}<div class=\"t-kicker\">GLOBAL BUSINESS TYCOON SIM</div><h1 class=\"t-name\">Road to <span>Chaebol</span></h1><p class=\"t-sub\">One company, picked by fate.<br>From a neighborhood startup in Korea, the US, Japan, China, Germany or India<br>to a ₩100 trillion empire.</p><div class=\"t-goal\">🏆 Goal <b>₩100T company value</b></div><div class=\"t-btns\">{1}<button class=\"btn {2}\" id=\"t-new\">🎲 Draw a company</button><button class=\"btn\" id=\"t-how\">📖 How to play</button><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\"><button class=\"btn\" id=\"t-fb\">💬 Feedback</button><button class=\"btn\" id=\"t-set\">⚙️ Settings</button></div></div><div class=\"t-feat\"><div><b>🌍</b>6 countries × 7 industries<br>× 4 starts</div><div><b>⚔️</b>Rivals · M&amp;A<br>control battles</div><div><b>🚨</b>{3}<br>random events</div></div><div class=\"t-foot\">Progress saves automatically · 🎵 Tap the screen to start the music</div></div>","새 회사 뽑기":"Draw a company","<p>지금 하던 <b>{0}</b>은(는) 사라져요. 새로 시작할까요?</p>":"<p><b>{0}</b> will be lost. Start over?</p>","새로 시작":"Start over","🎯 어떤 게임인가요?":"🎯 What is this game?","<p class=\"lead\">한국·미국·일본·중국·독일·인도 중 랜덤으로 정해지는 나라의 회사 대표가 되어 <b>기업가치 100조 원</b>을 만드는 게임이에요. 돈은 그 나라 통화로 보이고, 오른쪽 위 <b>₩</b> 버튼으로 원화로 바꿔 볼 수 있어요.</p><ul>\n    <li><b>🎲</b><span><b>시작이 매번 달라요.</b> 업종 {0}개와 시작 상황 4가지가 섞여요.</span></li>\n    <li><b>🌱</b><span><b>맨땅 창업</b> · <b>잘나가는 벤처</b> · <b>중견기업</b> · <b>물려받은 대기업</b> — 큰 회사로 시작해도 손 놓으면 무너져요.</span></li>\n    <li><b>👔</b><span>대표의 이력에 따라 보너스가 달라요.</span></li></ul>":"<p class=\"lead\">You become CEO of a company in a random country — Korea, the US, Japan, China, Germany or India — and try to reach <b>₩100 trillion in company value</b>. Money shows in local currency; switch to KRW with the <b>₩</b> button at the top right.</p><ul><li><b>🎲</b><span><b>Every start is different.</b> {0} industries and 4 starting situations.</span></li><li><b>🌱</b><span><b>Bootstrapped</b> · <b>Hot venture</b> · <b>Mid-size firm</b> · <b>Inherited conglomerate</b> — even big companies crumble if you sit still.</span></li><li><b>👔</b><span>Your CEO's background gives a bonus.</span></li></ul>","📅 한 달은 이렇게 흘러가요":"📅 How a month works","<ul>\n    <li><b>1</b><span><b>행동 고르기</b> — 매달 2~4번 행동할 수 있어요. 회사가 클수록 늘어나요. (화면의 ● 점)</span></li>\n    <li><b>2</b><span><b>시간은 저절로 흘러요</b> — 1주씩 진행되고 4주가 지나면 한 달이 끝나요. 아래 버튼으로 ⏸ 멈춤 · 속도(1x/2x/4x) · ⏭ 다음 주.</span></li>\n    <li><b>3</b><span><b>현금 흐름</b> — 매주 이익(손실)이 조금씩 들어오고, 월말에 정확히 결산돼요. 맨 아래 탭(회사·현황·경쟁·제품·일지)으로 화면을 바꿔요.</span></li>\n    <li><b>4</b><span><b>돌발 이벤트</b> — 아무 주에나 터지고, 뜨면 시간이 멈춰요. 선택에 따라 결과가 달라져요.</span></li></ul>\n    <p class=\"muted\" style=\"font-size:12px;margin:8px 0 0\">대출·상환, 제품 단종, 지분 매입은 행동을 쓰지 않아요.</p>":"<ul><li><b>1</b><span><b>Pick actions</b> — 2–4 per month, more as you grow. (the ● dots)</span></li><li><b>2</b><span><b>Time moves on its own</b> — one week at a time; after 4 weeks the month ends. Use the bar at the bottom: ⏸ pause · speed (1x/2x/4x) · ⏭ next week.</span></li><li><b>3</b><span><b>Cash flow</b> — profit (or loss) trickles in weekly and is settled at month end. Switch screens with the bottom tabs (Company · Stats · Rivals · Products · Log).</span></li><li><b>4</b><span><b>Random events</b> — can hit any week and pause the game. Your choice changes the outcome.</span></li></ul><p class=\"muted\" style=\"font-size:12px;margin:8px 0 0\">Loans, retiring products and buying shares don't use actions.</p>","🛠️ 할 수 있는 일":"🛠️ What you can do","<ul>\n    <li><b>🚀</b><span><b>신제품 출시</b> — 매출의 원천. 제품은 매달 조금씩 늙어요. 슬롯이 차면 단종할 제품을 골라요.</span></li>\n    <li><b>🔬</b><span><b>연구개발</b> — 기술력 ↑ → 더 좋은 제품. 가끔 실패하거나 대박 혁신이 터져요.</span></li>\n    <li><b>📣</b><span><b>마케팅 · 🌏 시장 확장</b> — 브랜드를 키워 수요를 늘리고 해외로 나가요.</span></li>\n    <li><b>👥</b><span><b>채용 · ☕ 복지 · 🏢 사옥 이전</b> — 생산능력과 사기. 사무실이 비좁으면 효율이 떨어져요.</span></li>\n    <li><b>💡</b><span><b>IP 사업</b> — 특허·캐릭터로 매달 로열티.</span></li>\n    <li><b>💰</b><span><b>투자 · 🔔 IPO</b> — 큰돈을 얻지만 <b>내 지분이 줄어요.</b></span></li>\n    <li><b>⚔️</b><span><b>경쟁사</b> — 분석(6개월마다)하거나 현금·주식으로 인수해 제품과 기술을 흡수해요.</span></li></ul>":"<ul><li><b>🚀</b><span><b>Launch Product</b> — your source of revenue. Products age every month; when slots are full you pick one to retire.</span></li><li><b>🔬</b><span><b>R&amp;D</b> — more tech → better products. Sometimes it fails, sometimes it's a breakthrough.</span></li><li><b>📣</b><span><b>Marketing · 🌏 Expand</b> — grow your brand and demand, then go abroad.</span></li><li><b>👥</b><span><b>Hire · ☕ Perks · 🏢 Move office</b> — capacity and morale. A cramped office hurts efficiency.</span></li><li><b>💡</b><span><b>IP Business</b> — monthly royalties from patents and characters.</span></li><li><b>💰</b><span><b>Funding · 🔔 IPO</b> — lots of cash, but <b>your stake shrinks.</b></span></li><li><b>⚔️</b><span><b>Rivals</b> — analyze them (every 6 months) or buy them with cash or stock to absorb their products and tech.</span></li></ul>","📈 성장 단계":"📈 Growth stages","<p class=\"lead\">기업가치가 오르면 단계가 올라가고, 매달 행동 횟수와 제품 슬롯이 늘어요.</p>\n    <div class=\"ladder\">{0}</div>":"<p class=\"lead\">As company value rises you move up a stage and get more actions per month and more product slots.</p><div class=\"ladder\">{0}</div>"," 이상":"+","시작":"Start","⚠️ 이러면 게임 오버":"⚠️ Game over if…","<ul>\n    <li><b>💸</b><span><b>부도</b> — 현금이 마이너스인 채로 3개월이 지나면 끝. 대출이나 투자로 버티세요.</span></li>\n    <li><b>🪑</b><span><b>해임</b> — 투자·증자로 내 지분이 10% 아래가 되면 쫓겨나요.</span></li>\n    <li><b>🗳️</b><span><b>경영권 상실</b> — 상장 후 적대 세력이 지분을 모아 표 대결에서 지면 끝. 지분을 사서 막으세요.</span></li>\n    <li><b>📉</b><span><b>몰락</b> — 제품이 늙고, 18개월 넘게 신제품이 없거나, 직원이 너무 많으면(대기업병) 서서히 무너져요.</span></li></ul>":"<ul><li><b>💸</b><span><b>Bankruptcy</b> — 3 months with negative cash and it's over. Survive with loans or funding.</span></li><li><b>🪑</b><span><b>Fired</b> — if funding rounds push your stake below 10%, you're out.</span></li><li><b>🗳️</b><span><b>Lost control</b> — after listing, raiders can   const st=weightedPick(STARTS);c.startId=st.id;

  // 기존 기업은 매출 규모를 맞춰 둔다 (흑자/적자 정도 = st.margin)
  const prev=s;s=c;
  genRivals(c);
  if(st.margin){
    c.rivals.forEach(r=>{r.tech=Math.round(c.tech*rf(r.inc?1:.6,r.inc?1.2:1.05));r.brand=r.inc?rand(50,70):rand(15,45)});
    const m0=calcMonth(1),fixed=m0.salary+HQ[c.hq].rent+c.employees*60+m0.interest;
    const target=st.margin*fixed/(1-I.cogs),sc=m0.demand>0?target/m0.demand:1;
    c.products.forEach(p=>p.power*=sc);
    const m=calcMonth(1);
    {const tot=c.products.reduce((a,p)=>a+p.power,0);c.products.forEach(p=>p.rev=tot?Math.round(m.prodRev*p.power/tot):0)}
    c.revenue=m.revenue;c.profit=m.pre-m.tax;c.expense=m.cost+m.tax;c.demand=m.demand;c.capacity=m.capacity;c.comp=m.comp;
  }
  calcValuation();s=prev;
  if(st.margin)c.rivals.forEach(r=>r.val=Math.round(c.valuation*(r.inc?rf(1.1,1.8):rf(.15,1.1))));
  c.lastLaunch=-rand(4,14);
  return c;
}
function weightedPick(arr){let r=Math.random()*arr.reduce((a,x)=>a+x.w,0);for(const x of arr){r-=x.w;if(r<=0)return x}return arr[0]}

  }
}

function calcValuation(){
  const I=ind();
  const op=s.revenue*12*I.mult*(0.5+s.tech/600+s.brand/500);
  const floor=3000+s.tech*300+s.brand*200+s.products.length*1000+(s.ips||[]).reduce((a,ip)=>a+ip.base*20*Math.pow(1.9,ip.lv),0);
  let v=Math.max(op,floor)+(s.cash-s.debt);
  if(s.ipo)v*=1.2;
  s.valuation=Math.max(0,Math.round(v));
  s.maxVal=Math.max(s.maxVal,s.valuation);
}
function loanLimit(){return Math.max(0,Math.round(Math.max(5000,s.revenue*6+s.valuation*.1)-s.debt))}
function clampStats(){
  s.brand=clamp(s.brand,0,100);s.morale=clamp(s.morale,0,100);s.tech=Math.max(1,s.tech);
  s.employees=Math.max(1,Math.round(s.employees));s.ownership=clamp(s.ownership,0,100);
}

  while(picks.length<3){const k=pick(pool);if(!picks.includes(k))picks.push(k)}
  return picks.map(k=>{
    let name=genName(s.industry,taken);
    if(k==='sequel'&&bp){const b=baseName(bp.name),m=bp.name.match(/\s(\d+)$/);name=`${b} ${m?+m[1]+1:2}`}

function launchProduct(cp){

function closeSnap(){return {valuation:s.valuation,cash:s.cash,debt:s.debt,revenue:s.revenue,profit:s.profit,employees:s.employees,ownership:s.ownership,wealth:s.valuation*s.ownership/100}}

function orgEff(){return s.employees>500?1/(1+Math.log10(s.employees/500)*.25):1}
function calcMonth(noise=1){
  const I=ind();
  const power=s.products.reduce((a,p)=>a+p.power,0);
  const comp=compFactor();
  const demand=power*REACH[s.reach].m*(0.4+s.brand/80)*noise*s.tempMult*comp;
  const crowd=s.employees/HQ[s.hq].cap;
  const capacity=s.employees*I.prod*(0.5+s.morale/200)*(1+s.tech/250)*(crowd>1?clamp(1/Math.sqrt(crowd),.5,1):1)*orgEff();
  const prodRev=Math.round(Math.min(demand,capacity));
  const ipRev=Math.round(s.ips.reduce((a,ip)=>a+royalty(ip),0));
  const revenue=prodRev+ipRev;
  const salary=s.employees*sal();
  const ops=Math.round(HQ[s.hq].rent+s.employees*60+prodRev*I.cogs+ipRev*.1);
  const interest=Math.round(s.debt*.006);
  const pre=revenue-salary-ops-interest;
  const tax=pre>0?Math.round(pre*.2):0;
  return {comp,demand,crowd,capacity,prodRev,ipRev,revenue,salary,ops,interest,pre,tax,cost:salary+ops+interest};

  const M=calcMonth(rf(.9,1.1));
  { // 제품별 매출: 생산능력 안에서 경쟁력 비율대로 나눈다
    const tot=s.products.reduce((a,p)=>a+p.power,0);
    s.products.forEach(p=>{p.prevRev=p.rev;p.rev=tot?Math.round(M.prodRev*p.power/tot):0});
  }
  const {demand,crowd,capacity,revenue,salary,ops,interest,pre,tax}=M;
  s.comp=M.comp;s.ipRev=M.ipRev;
  s.revenue=revenue;s.profit=pre-tax;s.expense=salary+ops+interest+tax;s.demand=demand;s.capacity=capacity;
  s.t=(s.t||0)+1;
  s.cash+=s.profit-(s.weekCash||0);s.weekCash=0;s.week=1;
  log(L`📊 ${s.month}월 결산 — 매출 ${won(revenue)}${s.ipRev?L` (IP 로열티 ${won(s.ipRev)})`:''} · 순이익 <b class="${s.profit>=0?'pos':'neg'}">${won(s.profit)}</b>`);
  if(crowd>1){const p=Math.min(10,Math.round(3+(crowd-1)*10));s.morale-=p;log(L`😵 ${HQ[s.hq].n}이(가) 너무 비좁아요! (${s.employees}/${HQ[s.hq].cap}명) 생산성 하락, 사기 -${p}. 사옥 이전이 필요해요.`,'warn')}
  if(s.products.length===0)log(L`💡 아직 제품이 없어요. 신제품을 출시해 매출을 만들어 보세요.`,'warn');
  else if(demand>capacity*1.3){s.morale-=3;log(L`🔥 주문이 생산능력(${won(capacity)})을 크게 넘어 야근 중입니다. 채용이 필요해요. 사기 -3`,'warn')}
  else if(demand>capacity*1.02)log(L`⚠️ 생산능력이 수요를 따라가지 못하고 있어요.`,'warn');
  s.products.forEach(p=>{p.power*=1-I.decay*(p.dm||1);p.age++});
  s.morale+=(60-s.morale)*.08;
  if(s.morale<25&&s.employees>3){const n=Math.max(1,Math.round(s.employees*.08));s.employees-=n;log(L`😞 사기 저하로 ${n}명이 퇴사했습니다.`,'warn')}
  if(s.tempMonths>0){s.tempMonths--;if(s.tempMonths===0)s.tempMult=1}
  if(s.investCd>0)s.investCd--;
  if(s.intel>0)s.intel--;
  rivalsTick();
  raidTick();
  clampStats();
  s.month++;if(s.month>12){s.month=1;s.year++}
  calcValuation();
  if(s.cash<0){s.negMonths++;log(L`🚨 자금이 바닥났습니다! ${3-s.negMonths}개월 안에 흑자 전환·대출·투자로 메우지 못하면 부도입니다.`,'warn')}
  else s.negMonths=0;
  // 몰락 장치: 혁신 정체 · 대기업병 · 전성기 대비 추락
  const idle=s.t-(s.lastLaunch||0);
  if(s.products.length&&idle>=18){s.brand=Math.max(0,s.brand-1);s.morale-=1;
    if(idle%6===0)log(L`🥱 혁신 정체: ${idle}개월째 신제품이 없습니다. 브랜드·사기가 매달 조금씩 떨어지고 있어요.`,'warn')}
  if(orgEff()<.9&&s.t%12===0)log(L`🐌 대기업병: 직원 ${s.employees.toLocaleString()}명, 조직 효율 ${Math.round(orgEff()*100)}%. 덩치가 클수록 1인당 생산성이 떨어져요.`,'warn');
  if(s.maxVal>=1e6&&s.valuation<s.maxVal*.6&&!s.flags.declineWarn){s.flags.declineWarn=1;
    const dd=Math.round((1-s.valuation/s.maxVal)*100);
    log(L`📉 몰락 위기! 기업가치가 전성기(${won(s.maxVal)})보다 ${dd}% 떨어졌습니다.`,'warn');
    pendingFx.push(()=>{toast(L`<b>📉 몰락 위기</b><br>전성기 대비 기업가치 -${dd}%`,'bad');shake()})}
  else if(s.valuation>s.maxVal*.85)s.flags.declineWarn=0;
  const ns=stageIdx();
  if(ns>prevStage){log(L`🎉 ${STAGES[ns].n}(으)로 성장했습니다! 매달 행동 ${maxAP()}회`,'good');
    pendingFx.push(()=>celebrate(L`<b>🎉 ${STAGES[ns].n} 승격!</b><br>이제 매달 행동 ${maxAP()}회`,ns>=4))}
  if(s.valuation>=1e8&&!s.flags.unicorn){s.flags.unicorn=1;log(L`🦄 기업가치 1조 돌파! 유니콘 기업이 되었습니다.`,'good');milestone('unicorn',L`🦄 유니콘 등극!`)}
  if(s.startId==='startup'||s.startId==='venture'){const kr=(s.cc||'KR')==='KR';if(s.t===12)milestone(kr?'y1':'y1g',L`🎂 창업 1주년! 아직 살아있다`);if(s.t===60)milestone(kr?'y5':'y5g',L`🏅 5년 생존!`);}
  if(s.t===120)milestone('y10',L`🏛️ 10년 기업`);
  if(s.cash<0)pendingFx.push(shake);
  else if(s.profit>0&&!s.flags.firstProfit){s.flags.firstProfit=1;pendingFx.push(()=>celebrate(L`<b>📈 첫 흑자 달성!</b>`))}
  s.history.push(s.valuation);if(s.history.length>240)s.history.shift();
  s.pm=s.close||null;s.close=closeSnap();
  s.ap=maxAP();
  const wasWon=s.won;
  checkEndings();
  freshReport=true;chartAnim=true;
  save();render();cloudAuto();
  if(!s.over&&s.won===wasWon){
    const ev=()=>s.fight?proxyFight():instant===true?rollEvent():null;
    if(instant)ev();
    else{busy=true;setTimeout(()=>{busy=false;if(s&&!s.over)ev()},RM?0:900)}
  }
}
async function nextMonthAnimated(){
  if(busy||!s||(s.over&&!s.won))return;
  busy=true;
  const ny=s.month===12?s.year+1:s.year,nm=s.month===12?1:s.month+1;
  if(!RM){
    const ov=document.createElement('div');ov.className='cal-ov';
    ov.innerHTML=L`<div class="cal"><div class="cal-head">${ny}</div><div class="cal-body"><div class="cal-page new">${nm}<small>월</small></div><div class="cal-page old">${s.month}<small>월</small></div></div><div class="cal-foot">결산 중…</div></div>`;
    document.body.appendChild(ov);
    await sleep(850);
    ov.classList.add('out');setTimeout(()=>ov.remove(),300);
  }
  busy=false;
  nextMonth();
}
function checkEndings(){
  if(s.over)return;
  if(s.sold)return ending('sold');
  if(s.negMonths>=3)return ending('bankrupt');
  if(s.ownership<10)return ending('fired');
  if(s.lostFight)return ending('takeover');
  if(s.valuation>=1e10&&!s.won)return ending('win');
}

    {l:L`몰래 양을 줄인다`,r:()=>{if(Math.random()<.5){s.brand-=10;return L`“슈링크플레이션” 고발 기사가 났습니다! 브랜드 -10`}return L`아무도 눈치채지 못했어요… 아직은.`}},
    {l:L`마진을 감수한다`,r:()=>{const c=Math.round(s.revenue*.3);s.cash-=c;s.brand+=2;return L`가격을 지켰습니다. 손실 ${won(c)}, “착한 가격” 브랜드 +2`}}]},
  {id:'smish',t:L`📱 우리 회사 사칭 스미싱`,c:()=>stageIdx()>=2&&s.products.length>0,w:1.5,text:()=>L`우리 회사 이름을 사칭한 “택배·환불” 문자로 고객 피해가 속출하고 있습니다.`,ch:[
    {l:()=>L`대고객 경고 + 피해 지원 (${won(Math.round(Math.max(1000,s.revenue*.1)))})`,r:()=>{s.cash-=Math.round(Math.max(1000,s.revenue*.1));s.brand+=2;return L`빠른 대응에 고객들이 오히려 신뢰를 보냅니다. 브랜드 +2`}},
    {l:L`우리 잘못이 아니다`,r:()=>{s.brand-=6;return L`“회사가 나몰라라 한다” 비판이 쏟아집니다. 브랜드 -6`}}]},
  {id:'parental',t:L`👶 육아휴직 신청 러시`,c:()=>s.employees>=20,w:2,text:()=>L`올해 아빠·엄마 직원들의 육아휴직 신청이 한꺼번에 몰렸습니다.`,ch:[
    {l:()=>L`적극 장려 + 대체 인력 (${won(Math.round(Math.max(2,s.employees*.03)*sal()*2))})`,r:()=>{s.cash-=Math.round(Math.max(2,s.employees*.03)*sal()*2);s.morale+=9;s.brand+=2;return L`“아이 키우기 좋은 회사” 입소문! 사기 +9, 브랜드 +2`}},
    {l:L`눈치를 준다`,r:()=>{s.morale-=8;if(Math.random()<.4){s.brand-=6;return L`블라인드에 폭로 글이 올라왔습니다. 사기 -8, 브랜드 -6`}return L`직원들이 실망했습니다. 사기 -8`}}]},
  {id:'firesafety',t:L`🧯 공장 안전 점검`,c:()=>['mfg','bio','beauty'].includes(s.industry)&&s.employees>=30,w:1.5,text:()=>L`소방 점검에서 배터리·화학물질 보관 상태가 위험하다는 지적을 받았습니다. 대피로도 부족하대요.`,ch:[
    {l:()=>L`전면 안전 투자 (${won(Math.round(Math.max(2000,s.revenue*.4)))})`,r:()=>{s.cash-=Math.round(Math.max(2000,s.revenue*.4));s.morale+=4;return L`설비를 바꾸고 대피 훈련을 했습니다. 직원들이 안심해요. 사기 +4`}},

  {id:'sandbox',t:L`🧪 규제샌드박스 승인`,c:()=>['it','bio'].includes(s.industry)&&s.products.length>0,w:1.5,fx:()=>{tm(1.2,3);s.tech+=2;return L`법에 막혀 못 내던 신사업이 “실증특례”로 허가를 받았습니다! 3개월간 매출 +20%, 기술력 +2`}},
  {id:'fakes',t:L`🏴‍☠️ 해외 짝퉁·상표 선점`,c:()=>['beauty','food','ent','game'].includes(s.industry)&&s.reach>=2&&s.products.length>0,w:2,text:()=>L`해외에서 ‘${best().name}’ 짝퉁이 팔리고, 현지 업자가 우리 상표를 먼저 등록해 버렸습니다.`,ch:[
    {l:()=>L`현지 상표 등록 + 소송 (${won(Math.round(Math.max(2000,s.revenue*.3)))})`,r:()=>{s.cash-=Math.round(Math.max(2000,s.revenue*.3));if(Math.random()<.7){s.brand+=2;return L`상표를 되찾고 짝퉁을 몰아냈습니다. 브랜드 +2`}return L`소송이 길어지고 있어요. 비용만 나갔습니다.`}},

    {l:()=>L`미국 현지 생산 투자 (${won(Math.round(Math.max(5000,s.revenue*1.2)))})`,r:()=>{s.cash-=Math.round(Math.max(5000,s.revenue*1.2));s.brand+=3;return L`현지 공장으로 관세를 피했습니다. 미국 언론도 호의적이에요. 브랜드 +3`}},
    {l:L`다른 나라로 수출 다변화`,r:()=>{s.cash-=Math.round(s.revenue*.3);tm(.92,2);return L`유럽·중동 판로를 뚫는 중입니다. 개척비 ${won(Math.round(s.revenue*.3))}, 2개월간 매출 -8%`}},
    {l:L`가격을 올려 버틴다`,r:()=>{tm(.82,3);s.brand-=2;return L`가격 인상에 미국 소비자가 등을 돌렸습니다. 3개월간 매출 -18%, 브랜드 -2`}}]},
  {id:'aiwave',t:L`🤖 생성형 AI 쇼크`,c:()=>s.employees>=10,w:2,text:()=>L`경쟁사들이 생성형 AI로 업무를 자동화하기 시작했습니다. 직원들은 일자리를 걱정하고 있어요.`,ch:[
    {l:()=>L`AI 전면 도입 (${won(Math.round(Math.max(3000,s.revenue*.4)))})`,r:()=>{s.cash-=Math.round(Math.max(3000,s.revenue*.4));s.tech+=6;s.morale-=6;return L`업무 속도가 눈에 띄게 빨라졌지만 직원들은 불안해합니다. 기술력 +6, 사기 -6`}},
    {l:()=>L`직원 AI 교육부터 (${won(Math.round(s.employees*sal()*.15))})`,r:()=>{s.cash-=Math.round(s.employees*sal()*.15);s.tech+=3;s.morale+=4;return L`“AI는 동료”라는 분위기가 생겼어요. 기술력 +3, 사기 +4`}},
    {l:L`지켜본다`,r:()=>{s.tech-=3;return L`경쟁사와 격차가 벌어지고 있습니다. 기술력 -3`}}]},
  {id:'power',t:L`⚡ 산업용 전기요금 인상`,c:()=>['mfg','it','game'].includes(s.industry)&&s.employees>=20,w:1.5,text:()=>L`산업용 전기요금이 또 올랐습니다. 공장과 서버를 돌리는 비용이 크게 늘었어요.`,ch:[
    {l:()=>L`태양광·자가발전 설비 (${won(Math.round(Math.max(4000,s.revenue*.6)))})`,r:()=>{s.cash-=Math.round(Math.max(4000,s.revenue*.6));s.brand+=3;return L`설비를 갖춰 전기료 부담을 덜고 친환경 이미지도 얻었어요. 브랜드 +3`}},
    {l:L`요금을 감수한다`,r:()=>{const c=Math.round(s.revenue*.25);s.cash-=c;return L`이번 분기 전기료만 ${won(c)} 더 나갔습니다.`}}]},
  {id:'heatwave',t:L`🥵 기록적 폭염`,c:()=>s.month>=6&&s.month<=8&&s.employees>=10,w:3,text:()=>L`열대야가 한 달 넘게 이어지고 있습니다. 현장 직원들이 더위에 지쳐 가요.`,ch:[
    {l:()=>L`냉방·휴게시간 확대 (${won(Math.round(s.employees*sal()*.12))})`,r:()=>{s.cash-=Math.round(s.employees*sal()*.12);s.morale+=6;return L`“우리 회사는 사람을 챙긴다” 사기 +6`}},

  {id:'hiring',t:L`👷 구인난`,c:()=>['mfg','food'].includes(s.industry)&&s.employees>=20,w:2,text:()=>L`공장과 매장에 일할 사람이 없습니다. 구인 공고를 내도 지원자가 오지 않아요.`,ch:[
    {l:L`외국인 근로자 고용`,r:()=>{const n=Math.max(2,Math.round(s.employees*.08));s.employees+=n;s.cash-=Math.round(n*sal()*.5);return L`외국인 근로자 ${n}명이 합류했습니다. 교육·숙소 비용 ${won(Math.round(n*sal()*.5))}`}},
    {l:()=>L`자동화 설비 투자 (${won(Math.round(Math.max(3000,s.revenue*.5)))})`,r:()=>{s.cash-=Math.round(Math.max(3000,s.revenue*.5));s.tech+=4;return L`스마트 공장으로 사람 손을 덜었어요. 기술력 +4`}},

  {id:'yellow',t:L`✊ 노란봉투법 시행`,c:()=>stageIdx()>=3,w:1.5,text:()=>L`하청업체 노조가 원청인 우리 회사에 직접 교섭을 요구해 왔습니다.`,ch:[

  {id:'cbam',t:L`🌍 EU 탄소국경세`,ind:'mfg',c:()=>s.reach>=3,w:2,text:()=>L`EU가 탄소를 많이 내뿜는 수입품에 비용을 물리기 시작했습니다. 유럽 거래처가 탄소 배출량 자료를 요구해요.`,ch:[
    {l:()=>L`탄소 감축 설비 투자 (${won(Math.round(Math.max(5000,s.revenue*.9)))})`,r:()=>{s.cash-=Math.round(Math.max(5000,s.revenue*.9));s.brand+=4;s.tech+=2;return L`저탄소 공정으로 유럽 거래처를 지켰습니다. 브랜드 +4, 기술력 +2`}},
    {l:L`비용을 떠안는다`,r:()=>{tm(.9,4);return L`탄소 비용만큼 유럽 수익이 줄었습니다. 4개월간 매출 -10%`}}]},
  {id:'pension',t:L`📋 국민연금 보험료 인상`,c:()=>s.employees>=10,w:1,fx:()=>{s.salaryMult*=1.005;return L`국민연금 보험료율이 올라 회사 부담분이 늘었습니다. 인건비 +0.5%`}},
  {id:'delivery',t:L`🛵 배달앱 수수료 갈등`,ind:'food',c:()=>s.products.length>0,w:2,text:()=>L`배달앱 수수료와 배달비가 올라 팔수록 남는 게 없다는 점주들의 하소연이 이어집니다.`,ch:[
    {l:()=>L`자체 주문앱·포장 할인 (${won(Math.round(Math.max(2000,s.revenue*.3)))})`,r:()=>{s.cash-=Math.round(Math.max(2000,s.revenue*.3));s.brand+=3;return L`단골이 자체 앱으로 옮겨 왔습니다. 브랜드 +3`}},
    {l:L`메뉴 가격 인상`,r:()=>{s.brand-=4;return L`“배달 가격 따로” 논란이 일었어요. 브랜드 -4`}},
    {l:L`수수료를 감수한다`,r:()=>{const c=Math.round(s.revenue*.12);s.cash-=c;return L`수수료로 ${won(c)}이 더 나갔습니다.`}}]},
  {id:'kbeauty',t:L`💄 K-뷰티 수출 신기록`,ind:'beauty',c:()=>s.reach>=2,w:2,fx:()=>{tm(1.3,2);s.brand+=4;return L`해외 매장에서 K-뷰티 제품이 품절 행진 중입니다! 2개월간 매출 +30%, 브랜드 +4`}},
  {id:'kfood',t:L`🍜 K-라면 수출 열풍`,ind:'food',c:()=>s.reach>=2,w:2,fx:()=>{tm(1.3,2);s.brand+=4;return L`해외 SNS에서 매운 라면 챌린지가 유행입니다! 2개월간 매출 +30%, 브랜드 +4`}},
  {id:'biodeal',t:L`💉 빅파마 기술수출 제안`,ind:'bio',c:()=>s.tech>=60&&s.products.length>0,w:2,text:()=>L`글로벌 제약사가 ‘${best().name}’의 기술을 사겠다고 제안했습니다. 계약금만 수백억 원대예요.`,ch:[

  {id:'panho',t:L`🀄 중국 판호 발급`,ind:'game',c:()=>s.reach>=2&&s.products.length>0,w:1.5,text:()=>L`‘${best().name}’이(가) 중국 서비스 허가(판호)를 받았습니다. 현지 퍼블리셔가 손을 내밀어요.`,ch:[
    {l:()=>L`중국 출시 (${won(Math.round(Math.max(3000,s.revenue*.5)))})`,r:()=>{s.cash-=Math.round(Math.max(3000,s.revenue*.5));if(Math.random()<.5){tm(1.4,3);s.brand+=4;return L`중국에서 대박! 3개월간 매출 +40%, 브랜드 +4`}return L`현지 경쟁작에 밀려 조용히 묻혔습니다…`}},
    {l:L`출시를 미룬다`,r:()=>L`규제 리스크를 피했지만 기회도 놓쳤습니다.`}]},
  {id:'workweek',t:L`🗓️ 주 4.5일제 요구`,c:()=>s.employees>=20,w:1.5,text:()=>L`직원들이 금요일 오후 퇴근, 주 4.5일제를 도입하자고 요구합니다. 정부 지원금도 있다고 해요.`,ch:[
    {l:L`시범 도입한다`,r:()=>{s.morale+=14;s.cash+=Math.round(Math.min(s.employees,300)*80);tm(.96,2);return L`직원 만족도 폭발! 사기 +14, 정부 지원금 ${won(Math.round(Math.min(s.employees,300)*80))} (2개월간 매출 -4%)`}},
    {l:L`아직은 이르다`,r:()=>{s.morale-=6;return L`“우리 회사는 언제쯤…” 사기 -6`}}]},
  {id:'leak',t:L`🔓 개인정보 유출`,ind:'it',c:()=>s.products.length>0,w:3,text:()=>L`해킹으로 고객 개인정보가 유출된 정황이 발견됐습니다.`,ch:[
    {l:L`즉시 공개하고 보상`,r:()=>{const c=Math.round(s.revenue*.6+1500);s.cash-=c;s.brand-=5;return L`정직한 대응. ${won(c)} 지출, 브랜드 -5`}},

// 한국 제도·문화가 들어간 이벤트는 한국 회사에서만, 그 나라 자신이 당사자인 이벤트는 그 나라에서 빼기
const EV_ONLY={chuseok:['KR'],audit:['KR'],tax:['KR'],gov:['KR'],yellow:['KR'],pension:['KR'],kwave:['KR'],kbeauty:['KR'],kfood:['KR'],kpopanim:['KR'],ott:['KR'],workweek:['KR'],sandbox:['KR'],hoesik:['KR'],gapjil:['KR'],origin:['KR'],gacha:['KR'],delivery:['KR'],subcon:['KR'],ftc:['KR']};
const EV_NOT={tariff:['US'],cbam:['DE'],ccommerce:['CN'],panho:['CN']};
const wt=e=>(typeof e.w==='function'?e.w():(e.w||1))*(s.evT&&s.evT[e.id]!==undefined?1:1.5); // 아직 안 본 이벤트가 조금 더 잘 나온다
function rollEvent(p=.5){
  if(Math.random()>p)return;
  s.evT=s.evT||{};
  const code=s.cc||'KR';
  const ok=e=>e.id!==s.lastEvent&&(!e.ind||e.ind===s.industry)&&(!EV_ONLY[e.id]||EV_ONLY[e.id].includes(code))&&(!EV_NOT[e.id]||!EV_NOT[e.id].includes(code))&&(!e.cc||e.cc===code)&&(!e.c||e.c());
  // 한 번 나온 이벤트는 24개월(명절 같은 계절 이벤트는 11개월) 동안 다시 안 나온다
  const cool=e=>s.evT[e.id]===undefined||s.t-s.evT[e.id]>=(e.id==='chuseok'?11:e.cd||24);
  let pool=EVENTS.filter(e=>ok(e)&&cool(e));
  if(!pool.length)return; // 다 본 이벤트뿐이면 이번엔 쉬어 간다
  let r=Math.random()*pool.reduce((a,e)=>a+wt(e),0),ev=pool[0];
  for(const e of pool){r-=wt(e);if(r<=0){ev=e;break}}
  s.lastEvent=ev.id;s.evT[ev.id]=s.t||0;
  // 실제 통계 팝업은 처음 볼 때만. 다시 보려면 ⚙️ 설정 → 통계 모음
  const newFact=FACTS[ev.id]&&factFits(ev.id)&&!seenFacts().includes(ev.id)?FACTS[ev.id]:null;
  const snap={cash:s.cash,brand:s.brand,morale:s.morale,tech:s.tech,tm:s.tempMult,pw:s.products.reduce((a,p)=>a+p.power,0)};
  const after=(m,quiet)=>{
    clampStats();calcValuation();log(`${ev.t} — ${m}`,'event');
    const pw=s.products.reduce((a,p)=>a+p.power,0);
    const score=(s.brand-snap.brand)+(s.morale-snap.morale)+(s.tech-snap.tech)*2+(s.cash-snap.cash)/Math.max(1000,Math.abs(snap.cash)||1)*20+(s.tempMult-snap.tm)*30+(snap.pw?(pw-snap.pw)/snap.pw*30:0);
    const kind=score>0.5?'good':score<-0.5?'bad':'';
    const fact=newFact;
    if(fact)markFact(ev.id);
    pendingFx.push(()=>{
      if(fact&&!(s.over&&!s.won))showFact(ev.t,`<span class="verdict ${kind==='bad'?'bad':'good'}">${['kwave','gov','kbeauty','kfood','fx','kpopanim','sandbox'].includes(ev.id)?L`🎉 좋은 소식이에요`:ev.id==='clinic'?(kind==='bad'?L`🩹 이번엔 실패했지만 다시 도전할 수 있어요`:L`🎉 임상 성공!`):['biodeal','panho','workweek','aiwave','venture','ott'].includes(ev.id)?(kind==='bad'?L`🩹 아쉬운 결과예요`:L`✅ 좋은 선택이었어요`):kind==='bad'?L`🩹 상처는 남았지만 살아남았어요`:L`🛡️ 위기를 이겨냈어요`}</span><p style="margin:4px 0 0">${esc(m)}</p>${factCard(fact)}`);
      else if(!quiet)toast(`<b>${esc(ev.t)}</b><br>${esc(m)}`,kind);
      if(kind==='bad')shake();if(kind==='good')confetti(30)});
    checkEndings();save();render();
  };
  if(ev.ch){
    modal(ev.t,L`<div class="news-tag">속보</div><p>${esc(ev.text())}</p>`,ev.ch.map(c=>({l:typeof c.l==='function'?c.l():c.l,f:()=>after(c.r())})),'event');
  }else{const m=ev.fx();after(m,true);
    if((!s.over||s.won)&&!newFact)modal(ev.t,L`<div class="news-tag">속보</div><p>${esc(m)}</p>`,[{l:L`확인`,f:()=>{}}],'event')}
}

const STYLES={'공격형':{t:1,b:1.2,g:1.3,d:L`공격적 확장, 인재 빼가기`},'기술형':{t:1.5,b:.7,g:1,d:L`R&D 집중, 고품질 제품`},'안정형':{t:.8,b:.9,g:.7,d:L`느리지만 꾸준한 성장`},'마케팅형':{t:.7,b:1.6,g:1.1,d:L`광고·브랜드 중심`}};
function makeRival(c,incumbent){
  const I=IND[c.industry];let name,n=0;
  do{name=coName(c.cc||'KR',c.industry)}while(n++<50&&(name===c.name||(c.rivals||[]).some(r=>r.name===name)));
  const base=Math.max(c.tech,20);
  return {name,style:incumbent?'안정형':pick(Object.keys(STYLES)),inc:!!incumbent,ceo:ceoName(c.cc||'KR'),
    tech:Math.round(incumbent?base*1.4+10:base*rf(.6,1.2)),
    brand:incumbent?rand(45,60):rand(3,20),
    val:Math.round(incumbent?rand(3,8)*1e6:Math.max(rand(2,30)*1e4,c.valuation*rf(.5,3))),
    prod:genName(c.industry,null,c.cc)};
}
function genRivals(c){c.rivals=[];c.rivals.push(makeRival(c,true));for(let i=0;i<3;i++)c.rivals.push(makeRival(c,false));c.intel=0}
const rStr=r=>r.tech*1.15*(.5+r.brand/100);
const myStr=()=>{const b=best();return b?b.q*(.5+s.brand/100):0};
function shares(){const all=[myStr(),...s.rivals.map(rStr)];const sum=all.reduce((a,b)=>a+b,0)||1;return all.map(v=>v/sum)}
function compFactor(){
  if(!s.rivals.length)return 1.3;
  const avg=s.rivals.reduce((a,r)=>a+rStr(r),0)/s.rivals.length,p=myStr();
  return p+avg>0?clamp(2*p/(p+avg),.6,1.3):1;
}
function rivalsTick(){
  const myShare=shares()[0];
  s.rivals.forEach(r=>{
    r.offer=null;
    const st=STYLES[r.style];
    r.tech+=rf(1.2,4.5)*st.t*60/(60+r.tech);
    r.brand=clamp(r.brand+rf(-.3,1.8)*st.b,0,100);
    let g=rf(-.015,.045)*st.g*(r.inc?.6:1);
    if(myShare>.5)g-=.01;
    if(r.val>1e9)g*=.5;
    r.val=Math.round(r.val*(1+g));
  });
  if(s.rivals.length&&Math.random()<.3){
    const r=pick(s.rivals),k=Math.random();
    if(k<.35){r.tech+=5;r.prod=genName(s.industry);log(L`⚔️ 경쟁사 ${r.name}이(가) 신제품 ‘${r.prod}’을(를) 출시했습니다.`,'rival')}
    else if(k<.55){r.val=Math.round(r.val*1.25);log(L`⚔️ ${r.name}, 대규모 투자 유치! 기업가치 ${won(r.val)}`,'rival')}
    else if(k<.7){r.brand=clamp(r.brand-10,0,100);r.val=Math.round(r.val*.85);log(L`⚔️ ${r.name} 오너 리스크 발생… 브랜드·기업가치 하락`,'rival')}
    else if(k<.85&&r.style==='공격형'&&s.employees>=10){s.tech=Math.max(1,s.tech-3);s.morale-=3;log(L`⚔️ ${r.name}이(가) 우리 개발자를 빼갔습니다. 기술력 -3, 사기 -3`,'warn')}
    else{r.brand=clamp(r.brand+6,0,100);log(L`⚔️ ${r.name}, 대대적인 광고 캠페인 시작`,'rival')}
  }
  for(const r of [...s.rivals]){
    if(!r.inc&&r.val<s.valuation/50&&Math.random()<.04){s.rivals.splice(s.rivals.indexOf(r),1);log(L`💀 경쟁사 ${r.name}이(가) 파산했습니다.`,'good')}
  }
  if(s.rivals.length<4&&Math.random()<.08){
    const r=makeRival(s,false);r.tech=Math.round(s.tech*rf(.5,.9));r.val=Math.round(Math.max(1e4,s.valuation*rf(.01,.1)));
    s.rivals.push(r);log(L`🆕 신생 경쟁사 ${r.name}(${tk(r.style)})이(가) 시장에 뛰어들었습니다.`,'rival');
  }
}
// M&A: 경쟁사의 제품 라인·기술·특허·인력을 통째로 가져오고, 제품 슬롯도 늘어난다
function acqOffer(r){
  if(!r.offer){
    const I=ind(),n=clamp(1+Math.floor(Math.log10(Math.max(r.val,1e4)/1e5)),1,3);
    const prods=[];for(let k=0;k<n;k++){const q=Math.max(5,Math.round(r.tech*rf(.85,1.1))),age=rand(2,14);
      prods.push({name:k===0?r.prod:genName(s.industry,s.products.map(x=>x.name)),q,power:q*q*I.k*Math.pow(1-I.decay,age),age,hit:false,flop:false})}
    r.offer={prods,ipBase:Math.round((r.tech+r.brand)*rf(6,10))};
  }
  const o=r.offer;
  const estRev=o.prods.reduce((a,p)=>a+p.power,0)*REACH[s.reach].m*(0.4+s.brand/80)*(s.comp||1);
  // 가격: 장부상 기업가치와 실제 매출가치 중 큰 쪽 + 경영권 프리미엄 15%
  const price=Math.round(Math.max(r.val,estRev*12*ind().mult*.7)*1.15);
  // 흡수 인원: 인수한 매출을 만들어 낼 만큼
  const perEmp=ind().prod*(0.5+s.morale/200)*(1+s.tech/250)*orgEff();
  const emp=Math.max(5,Math.round(estRev/perEmp*1.1));
  const own2=s.valuation>0?s.ownership*s.valuation/(s.valuation+price):0;
  return {...o,price,estRev,emp,tech2:Math.max(s.tech,Math.round(r.tech))+3,
    ip:s.ips.length<4,slot:(s.extraSlots||0)<3,own2};
}
function acquire(i,mode){
  const r=s.rivals[i];if(!r||s.over||s.ap<=0)return;
  const o=acqOffer(r);
  if(mode==='cash'){if(s.cash<o.price)return;s.cash-=o.price}
  else{if(o.own2<10)return;s.ownership=o.own2}
  s.ap--;
  s.tech=o.tech2;s.brand+=5;s.employees+=o.emp;
  if(o.slot)s.extraSlots=(s.extraSlots||0)+1;
  o.prods.forEach(p=>s.products.push({...p}));
  while(s.products.length>maxProd()){const w=s.products.reduce((a,b)=>a.power<b.power?a:b);s.products.splice(s.products.indexOf(w),1)}
  let ipTxt='';if(o.ip){s.ips.push({name:(ROMAN?r.name.split(' ')[0]+' ':r.name.slice(0,2))+ipWord(),base:o.ipBase,lv:1});ipTxt=L`, 특허 IP 확보`}
  s.rivals.splice(i,1);
  s.revenue+=Math.round(o.estRev); // 인수한 회사의 매출을 바로 합산 (다음 결산에서 다시 계산됨)
  clampStats();calcValuation();
  const pay=mode==='cash'?won(o.price):L`주식 교환(지분 ${s.ownership.toFixed(1)}%)`;
  s.log.unshift({d:dateStr(),t:L`🤝 ${r.name}을(를) ${pay}에 인수했습니다! 제품 ${o.prods.length}개·직원 ${o.emp.toLocaleString()}명 흡수, 기술력 ${Math.round(o.tech2)}${o.slot?L`, 제품 슬롯 +1`:''}${ipTxt}`,k:'good'});
  pendingFx.push(()=>celebrate(L`<b>🤝 ${esc(r.name)} 인수 완료!</b><br>제품 ${o.prods.length}개 · 예상 월 매출 +${won(o.estRev)}`,true));
  if(!seenFacts().includes('mna'))milestone('mna',L`🤝 첫 인수합병`);
  checkEndings();save();render();
}
function acqMenu(i){

function proxyFight(){
  s.fight=false;const r=s.raid;if(!r)return;
  const base=clamp(.2+s.morale/400+s.brand/400+(s.profit>0?.1:-.05)+(s.valuation>=s.maxVal*.9?.08:0),.12,.75);

  };

function ending(type){
  const myWealth=Math.round(s.valuation*s.ownership/100);
  const years=((s.year-2026)*12+s.month-1);
  const yt=L`${Math.floor(years/12)}년 ${years%12}개월`;
  const E={
    bankrupt:[L`💸 부도`,L`3개월 연속 자금난을 버티지 못하고 회사가 부도 처리되었습니다.`],
    takeover:[L`⚔️ 경영권 상실`,L`주주총회 표 대결에서 패배했습니다. 새 경영진이 회사를 접수했고, 당신은 대표 자리에서 물러납니다.`],
    fired:[L`🪑 대표이사 해임`,L`지분이 10% 아래로 떨어져 이사회에서 해임되었습니다. 회사는 남았지만 당신은 떠납니다.`],
    sold:[L`🤝 엑시트 성공`,L`회사를 매각하고 ${won(s.exitValue||0)}을 손에 쥐었습니다. 다음 창업을 준비해 볼까요?`],
    win:[L`👑 재벌 등극!`,L`기업가치 ${won(1e10)} 돌파! ${s.name}은(는) ${cc().n}을(를) 넘어 세계를 대표하는 그룹이 되었습니다.`],
  }[type];
  const surv=m=>m<12?100-36.1*m/12:m<=60?63.9-(27.4*(m-12)/48):36.5;
  const ctx=type==='bankrupt'||type==='fired'||type==='takeover'?((s.startId==='startup'||s.startId==='venture')&&(s.cc||'KR')==='KR'?`<p class="muted" style="font-size:13px;margin:8px 0 0">${years>=60?L`5년 넘게 버텼어요. 한국 신생기업 중 5년을 넘기는 곳은 36.5%뿐이에요.`:L`${yt} 버텼어요. 한국 신생기업 중 이만큼 버티는 곳은 약 ${Math.round(surv(years))}%예요.`}</p>`:'')+(type==='bankrupt'?factCard(MILES.dead):''):'';
  if(type==='bankrupt')markFact('dead');
  const body=L`<p>${E[1]}</p>${ctx}<div class="kv">
    <span class="muted">경영 기간</span><b>${yt}</b>
    <span class="muted">최고 기업가치</span><b>${won(s.maxVal)}</b>
    <span class="muted">최종 직원 수</span><b>${s.employees.toLocaleString()}명</b>
    <span class="muted">내 지분 가치</span><b>${won(type==='sold'?(s.exitValue||0):myWealth)}</b></div>`;
  if(type==='win')setTimeout(()=>confetti(200),300);
  if(type==='bankrupt'||type==='fired'||type==='takeover')shake();
  if(type==='win'){s.won=true;s.over=false;save();
    modal(E[0],body,[{l:L`📣 결과 공유하기`,f:()=>{shareText(resultText(type));ending(type)}},{l:L`계속 경영하기`,f:()=>{}},{l:L`새 회사 창업하기`,f:startScreen}]);return}
  s.over=true;s.ending=type;save();
  modal(E[0],body,[{l:L`📣 결과 공유하기`,f:()=>{shareText(resultText(type));ending(type)}},{l:L`새 회사 창업하기`,f:startScreen}]);
}

const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const prevVals={};
let statHTML,barHTML;
let busy=false,freshReport=false,chartAnim=false,lastLogSeen=-1,logSeq=0,pendingFx=[];
const FMT={won:v=>won(v),ppl:v=>Math.round(v).toLocaleString()+L`명`,pct:v=>v.toFixed(1)+'%',int:v=>String(Math.round(v)),pct0:v=>Math.round(v)+'%'};
const DFMT={won:d=>(d>0?'+':'')+won(d),ppl:d=>(d>0?'+':'')+Math.round(d).toLocaleString()+L`명`,pct:d=>(d>0?'+':'')+d.toFixed(1)+'%p',int:d=>(d>0?'+':'')+Math.round(d)};
const FLOAT_KEYS=new Set(['cash','valuation','employees','tech','brand','morale','ownership']);
const sleep=ms=>new Promise(r=>setTimeout(r,RM?0:ms));
function tween(el,from,to,fmt,dur=750){
  if(RM){el.textContent=fmt(to);return}
  const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(step)};
  el.textContent=fmt(from);requestAnimationFrame(step);
}
function floatAt(x,y,text,cls=''){
  if(RM)return;
  const f=document.createElement('div');f.className='floater '+cls;f.textContent=text;
  f.style.left=x+'px';f.style.top=y+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1300);
}
function floatOn(el,text,cls){if(!el)return;const r=el.getBoundingClientRect();floatAt(r.left+r.width/2,r.top,text,cls)}
function toast(html,kind=''){
  let box=document.getElementById('toasts');
  if(!box){box=document.createElement('div');box.id='toasts';document.body.appendChild(box)}
  const t=document.createElement('div');t.className='toast '+kind;t.innerHTML=html;box.appendChild(t);
  setTimeout(()=>t.classList.add('out'),RM?2500:2800);setTimeout(()=>t.remove(),3200);
}
function confetti(n=70){
  if(RM)return;
  const colors=['#f43f5e','#f59e0b','#10b981','#3b82f6','#a855f7','#facc15'];
  const box=document.createElement('div');box.className='confetti';
  for(let i=0;i<n;i++){const p=document.createElement('i');p.style.left=rand(0,100)+'vw';p.style.background=pick(colors);
    p.style.setProperty('--dx',rand(-140,140)+'px');p.style.setProperty('--r',rand(200,1000)+'deg');
    p.style.animationDelay=(Math.random()*.35)+'s';p.style.animationDuration=rf(1.5,2.6)+'s';
    if(Math.random()<.4)p.style.borderRadius='50%';box.appendChild(p)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3400);
}
function shake(){if(RM)return;const a=document.getElementById('root');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');
  const v=document.createElement('div');v.className='vignette';document.body.appendChild(v);setTimeout(()=>v.remove(),700)}
function celebrate(title,big){toast(title,'good');confetti(big?140:60)}
// 렌더 후: 숫자 카운트업, 변화량 표시, 막대 애니메이션
function animateAfterRender(){
  document.querySelectorAll('[data-k][data-v]').forEach(el=>{
    const k=el.dataset.k,to=+el.dataset.v,f=el.dataset.f;
    const from=prevVals[k];prevVals[k]=to;
    if(el.classList.contains('fill')){
      const w=to+'%';
      if(from===undefined||RM||from===to){el.style.width=w;return}
      el.style.transition='none';el.style.width=from+'%';void el.offsetWidth;el.style.transition='';el.style.width=w;return;
    }
    if(from===undefined||Math.abs(from-to)<1e-9)return;
    tween(el,from,to,FMT[f]);
    const st=el.closest('.stat,.bar');
    if(st){st.classList.remove('up','down');void st.offsetWidth;st.classList.add(to>from?'up':'down')}
    if(FLOAT_KEYS.has(k)){const d=to-from;if(f==='int'&&Math.abs(d)<.5)return;floatOn(el,DFMT[f](d),d>0?'pos':'neg')}
  });
  const fx=pendingFx;pendingFx=[];fx.forEach(f=>f());
}

// ===== 저장 / 불러오기 =====
// 클라우드(계정에 저장, 기기 간 이어하기)를 쓸 수 있으면 쓰고, 아니면 이 기기의 브라우저에 저장한다.
const SLOTS=[{k:'auto',n:L`자동 저장`},{k:'slot1',n:L`슬롯 1`},{k:'slot2',n:L`슬롯 2`},{k:'slot3',n:L`슬롯 3`}];
const CLOUD={db:null,uid:null,ready:false,writing:false,dirty:false,offered:false};
async function initCloud(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    CLOUD.db=db;CLOUD.uid=uid;CLOUD.ready=true;
    if(s&&!document.getElementById('title'))render();
    offerCloudContinue();
  }catch(e){}
}
const slotRef=k=>CLOUD.db.collection('data/users/'+CLOUD.uid).doc(k);
function slotBody(){
  const st=JSON.parse(JSON.stringify(s));st.log=st.log.slice(0,60);
  return {name:s.name,industry:s.industry,date:L`${s.year}년 ${s.month}월`,valuation:s.valuation,stage:STAGES[stageIdx()].n,over:!!s.over,savedAt:Date.now(),state:JSON.stringify(st)};
}
async function writeSlot(k){
  const body=slotBody();
  if(CLOUD.ready){await slotRef(k).set(body);return}
  localStorage.setItem('kcorp-slot-'+k,JSON.stringify(body));
}
async function readSlot(k){
  if(CLOUD.ready){const d=await slotRef(k).get();return d.exists?d.data():null}
  try{const t=localStorage.getItem('kcorp-slot-'+k);return t?JSON.parse(t):null}catch(e){return null}
}
async function removeSlot(k){
  if(CLOUD.ready){await slotRef(k).delete();return}
  try{localStorage.removeItem('kcorp-slot-'+k)}catch(e){}
}
// 매달 결산 후 자동 저장 (클라우드는 한 번에 하나씩만 쓴다)
async function cloudAuto(){
  if(!s)return;
  if(!CLOUD.ready){try{localStorage.setItem('kcorp-slot-auto',JSON.stringify(slotBody()))}catch(e){}return}
  if(CLOUD.writing){CLOUD.dirty=true;return}
  CLOUD.writing=true;
  try{await writeSlot('auto')}catch(e){}
  CLOUD.writing=false;
  if(CLOUD.dirty){CLOUD.dirty=false;cloudAuto()}
}
function applyLoaded(body){
  const st=migrate(JSON.parse(body.state));
  for(const k in prevVals)delete prevVals[k];
  lastLogSeen=-1;sceneBldKey='';const cr=document.getElementById('crowd');if(cr)cr.innerHTML='';
  document.getElementById('modal-root').innerHTML='';
  s=st;save();hideTitle();clock.run=false;render();
  toast(L`<b>📂 불러왔어요</b><br>${esc(body.name)} · ${esc(body.date)}`,'good');
}
// 다른 기기에서 더 진행한 게임이 있으면 이어하기를 제안
async function offerCloudContinue(){
  if(CLOUD.offered)return;CLOUD.offered=true;
  let auto;try{auto=await readSlot('auto')}catch(e){return}
  if(!auto||auto.over)return;
  const localAt=s?.savedAt||0;
  if(s&&auto.savedAt<=localAt+30000)return;
  modal(L`☁️ 이어서 하기`,L`<p>계정에 저장된 게임이 있어요.</p><div class="kv"><span class="muted">회사</span><b>${esc(auto.name)}</b><span class="muted">진행</span><b>${esc(auto.date)} · ${esc(auto.stage)}</b><span class="muted">기업가치</span><b>${won(auto.valuation)}</b><span class="muted">저장 시각</span><b>${new Date(auto.savedAt).toLocaleString('ko-KR')}</b></div>${s?L`<p class="muted" style="font-size:12px">지금 이 기기에서 하던 게임보다 최근에 저장됐어요.</p>`:''}`,
    [{l:L`☁️ 이어서 하기`,f:()=>applyLoaded(auto)},{l:s?L`지금 게임 계속하기`:L`새로 시작하기`,f:()=>{if(!s)startScreen()}}]);
}
function relTime(t){const m=Math.round((Date.now()-t)/60000);return m<1?L`방금`:m<60?L`${m}분 전`:m<1440?L`${Math.round(m/60)}시간 전`:new Date(t).toLocaleDateString('ko-KR')}
async function saveMenu(){
  const m=modal(L`💾 저장 / 불러오기`,L`<p class="muted" style="margin-top:0;font-size:13px">${CLOUD.ready?L`☁️ <b>클라우드 저장</b> 사용 중이에요. 휴대폰·PC 어디서 열어도 이어서 할 수 있어요.`:L`💻 이 기기의 브라우저에만 저장돼요. 다른 기기에서는 보이지 않아요.`}</p><div class="slots"><p class="muted">불러오는 중…</p></div>`,[{l:L`닫기`,f:()=>{}}]);
  const box=m.querySelector('.slots');
  let rows;
  try{rows=await Promise.all(SLOTS.map(async sl=>({...sl,d:await readSlot(sl.k)})))}
  catch(e){box.innerHTML=L`<p class="neg">저장 목록을 불러오지 못했어요. 잠시 후 다시 열어 주세요.</p>`;return}
  if(!document.body.contains(box))return;
  box.innerHTML=rows.map(r=>`<div class="slot" data-k="${r.k}">
    <div class="slot-info"><b>${r.n}</b>${r.d?L`<span>${esc(r.d.name)} · ${esc(r.d.date)} · ${won(r.d.valuation)}</span><span class="muted">${relTime(r.d.savedAt)} 저장${r.d.over?L` · 종료된 게임`:''}</span>`:L`<span class="muted">비어 있음</span>`}</div>
    <div class="slot-btns">${r.k!=='auto'?L`<button class="btn" data-act="save">저장</button>`:''}${r.d?L`<button class="btn" data-act="load">불러오기</button><button class="btn" data-act="del" aria-label="삭제">🗑</button>`:''}</div></div>`).join('');
  box.querySelectorAll('.slot button').forEach(b=>b.onclick=async()=>{
    const k=b.closest('.slot').dataset.k,row=rows.find(r=>r.k===k),act=b.dataset.act;
    const needConfirm=(act==='save'&&row.d)||act==='del'||(act==='load'&&s&&!s.over);
    if(needConfirm&&!b.dataset.armed){b.dataset.armed=1;b.textContent=act==='save'?L`덮어쓸까요?`:act==='del'?L`삭제할까요?`:L`지금 게임 대신?`;b.classList.add('warnbtn');return}
    b.disabled=true;b.textContent='…';
    try{
      if(act==='save'){await writeSlot(k);toast(L`<b>💾 ${row.n}에 저장했어요</b>`,'good');saveMenu()}
      else if(act==='load'){applyLoaded(row.d)}
      else{await removeSlot(k);saveMenu()}
    }catch(e){b.textContent=L`실패`;toast(e&&e.code==='quota_exceeded'?L`저장 공간이 가득 찼어요. 다른 슬롯을 지워 주세요.`:L`저장하지 못했어요. 잠시 후 다시 시도해 주세요.`,'bad')}
  });
}

function drawChart(anim){
  const cv=document.getElementById('chart');if(!cv)return;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const d=s.history.map(v=>Math.log10(Math.max(1,v)));
  if(d.length<2){g.fillStyle=cs.getPropertyValue('--muted');g.font='12px sans-serif';g.fillText(L`몇 달 지나면 그래프가 그려집니다`,4,h/2);return}
  const mn=Math.min(...d),mx=Math.max(...d,mn+.5);
  const X=i=>4+i/(d.length-1)*(w-8),Y=v=>h-6-(v-mn)/(mx-mn)*(h-12);
  const accent=cs.getPropertyValue('--accent').trim();
  const frame=p=>{
    g.clearRect(0,0,w,h);
    const last=d.length-1,endI=last-1+p;
    const ex=X(last-1)+(X(last)-X(last-1))*p,ey=Y(d[last-1])+(Y(d[last])-Y(d[last-1]))*p;
    // 영역 채우기
    const grad=g.createLinearGradient(0,0,0,h);grad.addColorStop(0,accent+'55');grad.addColorStop(1,accent+'00');
    g.beginPath();g.moveTo(X(0),h);d.forEach((v,i)=>{if(i<=last-1)g.lineTo(X(i),Y(v))});g.lineTo(ex,ey);g.lineTo(ex,h);g.closePath();g.fillStyle=grad;g.fill();
    g.strokeStyle=accent;g.lineWidth=2;g.lineJoin='round';g.beginPath();
    d.forEach((v,i)=>{if(i<=last-1)i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v))});g.lineTo(ex,ey);g.stroke();
    g.fillStyle=accent;g.beginPath();g.arc(ex,ey,3.5,0,Math.PI*2);g.fill();
  };
  if(!anim||RM)return frame(1);
  const t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/700);frame(1-Math.pow(1-p,3));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step);
}

// ===== 시간 흐름: 1주 단위 자동 진행, 팝업이 뜨면 멈춤 =====
const SPEEDS=[{n:'1x',ms:3000},{n:'2x',ms:1500},{n:'4x',ms:700}];
const clock={run:false,spd:0,acc:0,last:0};
try{clock.spd=Math.min(2,+localStorage.getItem('kcorp-spd')||0)}catch(e){}
const blocked=()=>!s||(s.over&&!s.won)||busy||!!document.getElementById('modal-root').firstChild||!!document.getElementById('title')||document.hidden;
function weekTick(){
  if(!s||(s.over&&!s.won))return;
  const free=()=>!document.getElementById('modal-root').firstChild&&!(s.over&&!s.won);
  if((s.week||1)>=4){nextMonth('clock');toast(L`<b>📊 ${s.month===1?12:s.month-1}월 결산</b><br>순이익 ${won(s.profit)}`,s.profit>=0?'good':'bad');if(free())rollEvent(.125);return}
  const w=calcMonth(rf(.9,1.1));const wp=Math.round((w.pre-w.tax)/4);
  s.week=(s.week||1)+1;s.cash+=wp;s.weekCash=(s.weekCash||0)+wp;
  calcValuation();checkEndings();save();render();
  if(free())rollEvent(.125);
}
function clockFrame(){
  const now=performance.now(),dt=Math.min(250,now-(clock.last||now));clock.last=now;
  if(clock.run&&!blocked()){clock.acc+=dt;if(clock.acc>=SPEEDS[clock.spd].ms){clock.acc=0;weekTick()}}
  const f=document.querySelector('.wk-fill');
  if(f&&s)f.style.width=(((s.week||1)-1)+clock.acc/SPEEDS[clock.spd].ms)/4*100+'%';
}
setInterval(clockFrame,100);

// 배경음악: 파일 없이 Web Audio로 직접 연주하는 잔잔한 루프. 적자일 땐 단조로 바뀐다.
const BGM={ctx:null,master:null,timer:0,next:0,step:0,bar:0,noise:null};
const midi=n=>440*Math.pow(2,(n-69)/12);
const PROG={
  up:[{b:36,c:[52,55,59,64]},{b:33,c:[52,55,57,60]},{b:29,c:[52,57,60,64]},{b:31,c:[50,55,59,62]}],
  down:[{b:33,c:[52,57,60,64]},{b:29,c:[53,57,60,65]},{b:26,c:[53,57,62,65]},{b:28,c:[52,56,59,64]}],
};
function bgmInit(){
  if(BGM.ctx)return true;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  try{BGM.ctx=new AC()}catch(e){return false}
  const c=BGM.ctx,comp=c.createDynamicsCompressor(),lp=c.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=5200;
  BGM.master=c.createGain();BGM.master.gain.value=0;
  BGM.master.connect(lp);lp.connect(comp);comp.connect(c.destination);
  const len=c.sampleRate*.2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;BGM.noise=buf;
  return true;
}
function tone(type,f,t0,dur,vol,att=.01,cut){
  const c=BGM.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
  let out=o;if(cut){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);out=fl}
  out.connect(g);g.connect(BGM.master);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+att);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.start(t0);o.stop(t0+dur+.05);
}
function bgmStep(t0){
  const c=BGM.ctx,st=BGM.step%16,mood=s&&(s.profit<0||s.cash<0)?'down':'up';
  const ch=PROG[mood][BGM.bar%4],sp=60/84/4;
  if(st===0){ // 패드 화음
    ch.c.forEach((n,i)=>{tone('triangle',midi(n)*(i%2?1.003:.997),t0,sp*16*1.1,.028,.5,1400)});
    tone('sine',midi(ch.b),t0,sp*7,.16,.02);
  }
  if(st===8)tone('sine',midi(ch.b+(BGM.bar%2?7:0)),t0,sp*6,.13,.02);
  if(st===14&&BGM.bar%2)tone('sine',midi(ch.b+12),t0,sp*2,.08,.01);
  // 아르페지오: 마디마다 조금씩 다른 패턴
  const pat=[[0,3,6,10,12],[0,4,6,8,11,14],[2,6,10,13],[0,3,7,10,12,15]][BGM.bar%4];
  if(pat.includes(st)){const n=ch.c[(st+BGM.bar)%4]+12+(st>=12?12:0);tone('triangle',midi(n),t0,.35,.035,.005,2600)}
  if(st%4===2){ // 살짝 하이햇
    const n=c.createBufferSource(),hp=c.createBiquadFilter(),g=c.createGain();n.buffer=BGM.noise;hp.type='highpass';hp.frequency.value=7000;
    n.connect(hp);hp.connect(g);g.connect(BGM.master);g.gain.setValueAtTime(.025,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.05);n.start(t0);n.stop(t0+.06);
  }
  if(st===0||st===8){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(110,t0);o.frequency.exponentialRampToValueAtTime(45,t0+.12);
    o.connect(g);g.connect(BGM.master);g.gain.setValueAtTime(.22,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.18);o.start(t0);o.stop(t0+.2)}
  BGM.step++;if(BGM.step%16===0)BGM.bar++;
}
function bgmSchedule(){
  const c=BGM.ctx,sp=60/84/4;
  while(BGM.next<c.currentTime+.25){bgmStep(BGM.next);BGM.next+=sp}
}
function bgmStart(){
  if(!SET.bgm||!bgmInit())return;
  const c=BGM.ctx;c.resume?.();
  if(!BGM.timer){BGM.next=c.currentTime+.08;BGM.timer=setInterval(bgmSchedule,60)}
  BGM.master.gain.cancelScheduledValues(c.currentTime);
  BGM.master.gain.setTargetAtTime(SET.vol*.55,c.currentTime,.4);
}
function bgmStop(){
  if(!BGM.ctx||!BGM.timer)return;
  const c=BGM.ctx;BGM.master.gain.setTargetAtTime(0,c.currentTime,.15);
  const tm=BGM.timer;BGM.timer=0;setTimeout(()=>{clearInterval(tm);if(!BGM.timer)c.suspend?.()},600);
}
function setBgm(on){SET.bgm=on;saveSet();on?bgmStart():bgmStop();document.querySelectorAll('.bgm-ic').forEach(b=>b.textContent=on?'🔊':'🔇')}
document.addEventListener('pointerdown',()=>{if(SET.bgm&&!BGM.timer)bgmStart()},{capture:true});
document.addEventListener('visibilitychange',()=>{if(!BGM.ctx)return;if(document.hidden)BGM.ctx.suspend?.();else if(SET.bgm&&BGM.timer)BGM.ctx.resume?.()});

    ${s&&!document.getElementById('title')?L`<div class="set-row"><div class="lbl">🏢 게임</div><button class="btn" id="set-new" style="width:100%">🎲 새 회사로 다시 시작</button></div>`:''}

  m.querySelectorAll('#set-theme button').forEach(b=>b.onclick=()=>{SET.theme=b.dataset.o;saveSet();m.querySelectorAll('#set-theme button').forEach(x=>x.classList.toggle('on',x===b));applyTheme()});

  const vr=m.querySelector('.vol input');vr.oninput=()=>{SET.vol=vr.value/100;saveSet();if(BGM.ctx&&BGM.timer)BGM.master.gain.setTargetAtTime(SET.vol*.55,BGM.ctx.currentTime,.05)};

}
